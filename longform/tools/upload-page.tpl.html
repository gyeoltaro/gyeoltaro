<title>롱폼 업로드 문구</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Noto+Sans+Mono:wght@400&display=swap">
<style>
/* 레이아웃: 위에 예약 시각 탭 3개, 아래에 복사할 칸이 세로로 한 줄씩. 칸마다 복사 버튼과 글자 수 */
:root{
  --bg:#f6f5f2; --panel:#ffffff; --fg:#1d2330; --dim:#5d6678; --line:#dcdad3;
  --accent:#1f5fd6; --accent-fg:#ffffff; --ok:#16794a; --ok-bg:#dff3e8; --warn:#9a5a00;
  --field:#fbfaf8;
  --sans:"Noto Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --mono:"Noto Sans Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12161f; --panel:#1b212d; --fg:#e8ebf2; --dim:#9aa3b5; --line:#2e3646;
  --accent:#7aa5ff; --accent-fg:#0d1220; --ok:#6fd6a0; --ok-bg:#183a2b; --warn:#f0b35a; --field:#161b25; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12161f; --panel:#1b212d; --fg:#e8ebf2; --dim:#9aa3b5; --line:#2e3646;
  --accent:#7aa5ff; --accent-fg:#0d1220; --ok:#6fd6a0; --ok-bg:#183a2b; --warn:#f0b35a; --field:#161b25; color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:15px;line-height:1.6;
  padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
main{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
h1{font-size:1.35rem;line-height:1.3;margin:0;text-wrap:balance}
.sub{margin:4px 0 0;color:var(--dim);font-size:.9rem}
.tabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tab{font:inherit;text-align:left;background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer;min-width:0}
.tab b{display:block;font-family:var(--mono);font-size:1.05rem;font-weight:400}
.tab span{display:block;font-size:.85rem;color:var(--dim);overflow-wrap:anywhere}
.tab[aria-selected="true"]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent) inset}
.tab:focus-visible,.copy:focus-visible,.theme:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.head{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:baseline;color:var(--dim);font-size:.88rem}
.head strong{color:var(--fg);font-size:1.1rem}
.head code{font-family:var(--mono);font-size:.85rem}
.field{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.row{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;justify-content:space-between}
.label{font-weight:700;font-size:.92rem}
.label em{font-style:normal;font-weight:400;color:var(--dim);margin-left:6px;font-size:.82rem}
.count{font-family:var(--mono);font-size:.78rem;color:var(--dim)}
.copy{font:inherit;font-size:.88rem;font-weight:700;background:var(--accent);color:var(--accent-fg);border:0;border-radius:8px;padding:8px 16px;min-height:40px;cursor:pointer}
.copy.done{background:var(--ok-bg);color:var(--ok)}
.copy.fail{background:var(--field);color:var(--warn);border:1px solid var(--warn)}
.text{margin:0;background:var(--field);border:1px solid var(--line);border-radius:8px;padding:10px 12px;white-space:pre-wrap;overflow-wrap:anywhere;font-family:var(--sans);font-size:.93rem;line-height:1.65;user-select:all;-webkit-user-select:all}
.check{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px;font-size:.9rem}
.check label{display:flex;gap:10px;align-items:flex-start;cursor:pointer}
.check input{margin-top:5px;width:18px;height:18px;accent-color:var(--accent);flex:none}
.theme{align-self:flex-start;font:inherit;font-size:.82rem;background:none;color:var(--dim);border:1px solid var(--line);border-radius:8px;padding:4px 10px;cursor:pointer}
@media (max-width:420px){.tab b{font-size:.95rem}.tab span{font-size:.78rem}}
@media (prefers-reduced-motion:no-preference){.copy{transition:background .15s}}
</style>

<main>
  <div>
    <h1>롱폼 LF.04 업로드 문구</h1>
    <p class="sub">LF.04 저가 커피 계산서 · 칸마다 [복사]를 누르고 스튜디오에 붙여 넣으세요.</p>
  </div>
  <div class="tabs" role="tablist" id="tabs"></div>
  <div id="view" role="tabpanel"></div>
  <button class="theme" id="themeBtn" type="button">밝게 / 어둡게</button>
</main>

<script>
const DATA=__DATA__;
const $=s=>document.querySelector(s);
const bytes=s=>new TextEncoder().encode(s).length;
let cur=0;
try{const v=+localStorage.getItem('upl-lf');if(v>=0&&v<DATA.length)cur=v;}catch(e){}

function esc(s){return s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function field(id,label,note,text,count){
  return `<section class="field">
    <div class="row"><span class="label">${label}<em>${note}</em></span><span class="count">${count}</span></div>
    <pre class="text" id="${id}">${esc(text)}</pre>
    <div class="row"><button class="copy" type="button" data-t="${id}">복사</button></div>
  </section>`;
}
function render(){
  const e=DATA[cur];
  $('#tabs').innerHTML=DATA.map((d,i)=>`<button class="tab" role="tab" type="button" data-i="${i}" aria-selected="${i===cur}"><b>${d.ep}</b><span>${d.name}</span></button>`).join('');
  const checks=e.checks;
  $('#view').innerHTML=`<div style="display:flex;flex-direction:column;gap:12px">
    <div class="head"><strong>${e.ep} ${e.name}</strong><span>파일 <code>${e.thumb}</code></span><span><code>${e.file}</code></span></div>
    ${e.fields.map(f=>field(f[0],f[1],f[2],f[3],f[0]==='dd'?bytes(f[3])+' / 5,000바이트':f[0]==='tg'?[...f[3]].length+'자 / 500':[...f[3]].length+'자')).join('')}
    <section class="field"><span class="label">스튜디오 체크</span>
      <ul class="check">${checks.map((c,i)=>`<li><label><input type="checkbox" id="ck${cur}_${i}"> <span>${esc(c)}</span></label></li>`).join('')}</ul>
    </section></div>`;
  document.querySelectorAll('.check input').forEach(b=>{
    try{b.checked=localStorage.getItem('upl-'+b.id)==='1';}catch(e){}
    b.addEventListener('change',()=>{try{localStorage.setItem('upl-'+b.id,b.checked?'1':'0');}catch(e){}});
  });
}
function selectText(el){const r=document.createRange();r.selectNodeContents(el);const s=getSelection();s.removeAllRanges();s.addRange(r);}
document.addEventListener('click',async ev=>{
  const tab=ev.target.closest('.tab');
  if(tab){cur=+tab.dataset.i;try{localStorage.setItem('upl-lf',cur);}catch(e){}render();return;}
  const btn=ev.target.closest('.copy');
  if(!btn)return;
  const el=document.getElementById(btn.dataset.t),txt=el.textContent;
  try{await navigator.clipboard.writeText(txt);btn.textContent='복사됨';btn.className='copy done';}
  catch(e){selectText(el);btn.textContent='선택됨 · 길게 눌러 복사';btn.className='copy fail';}
  setTimeout(()=>{btn.textContent='복사';btn.className='copy';},1800);
});
$('#themeBtn').addEventListener('click',()=>{
  const r=document.documentElement,dark=r.dataset.theme?r.dataset.theme==='dark':matchMedia('(prefers-color-scheme:dark)').matches;
  r.dataset.theme=dark?'light':'dark';
});
render();
</script>
