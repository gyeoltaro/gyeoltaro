<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>에이전트 오피스</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Orbit&display=swap">
<style>
  /* Layout: a full-bleed 3D office model on the left, a dispatch console docked on the right; on phones the console stacks under the model. */
  :root{
    --ground: #dde3e0;
    --paper: #f6f7f4;
    --raised: #ffffff;
    --ink: #18201e;
    --ink-2: #55615d;
    --ink-3: #7c8783;
    --line: #d4dbd7;
    --accent: #2f47c6;
    --accent-ink: #ffffff;
    --accent-soft: #e2e7fa;
    --ok: #22804c;
    --ok-soft: #dcefe2;
    --warn: #995e06;
    --warn-soft: #f5e9d2;
    --a0: #2f47c6; --a1: #0a7183; --a2: #b9285d; --a3: #b64708; --a4: #23803a; --a5: #806000; --a6: #5b3fd0; --a7: #85582b;
    --shadow: 0 1px 2px rgba(24,32,30,.06), 0 12px 32px -14px rgba(24,32,30,.28);
    --f-display: "Orbit", "IBM Plex Sans KR", system-ui, sans-serif;
    --f-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
    --f-mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --ground: #0b0f14; --paper: #11161d; --raised: #18202a;
      --ink: #e4e9ec; --ink-2: #9ca7b0; --ink-3: #6e7984; --line: #26303b;
      --accent: #8d9eff; --accent-ink: #0b1030; --accent-soft: #1d2549;
      --ok: #6fcf98; --ok-soft: #14301f; --warn: #e5b55e; --warn-soft: #33270f;
      --a0: #97a8ff; --a1: #52c8d9; --a2: #f27ba7; --a3: #ff9b5e; --a4: #72d48c; --a5: #f1cc4b; --a6: #b7a5ff; --a7: #dcae7c;
      --shadow: 0 1px 2px rgba(0,0,0,.5), 0 14px 34px -14px rgba(0,0,0,.75);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"]{
    --ground: #0b0f14; --paper: #11161d; --raised: #18202a;
    --ink: #e4e9ec; --ink-2: #9ca7b0; --ink-3: #6e7984; --line: #26303b;
    --accent: #8d9eff; --accent-ink: #0b1030; --accent-soft: #1d2549;
    --ok: #6fcf98; --ok-soft: #14301f; --warn: #e5b55e; --warn-soft: #33270f;
    --a0: #97a8ff; --a1: #52c8d9; --a2: #f27ba7; --a3: #ff9b5e; --a4: #72d48c; --a5: #f1cc4b; --a6: #b7a5ff; --a7: #dcae7c;
    --shadow: 0 1px 2px rgba(0,0,0,.5), 0 14px 34px -14px rgba(0,0,0,.75);
    color-scheme: dark;
  }

  *{ box-sizing: border-box; }
  :root{ padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
  html, body{ height: 100%; }
  body{
    margin: 0;
    background: var(--ground);
    color: var(--ink);
    font: 400 14px/1.5 var(--f-body);
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }
  button, input{ font: inherit; color: inherit; }
  :focus-visible{ outline: 2px solid var(--accent); outline-offset: 2px; }
  [hidden]{ display: none !important; }
  .sr{ position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  .app{
    height: 100%;
    display: grid;
    grid-template-columns: minmax(0, 1fr) clamp(340px, 29vw, 420px);
  }

  /* ---------- stage ---------- */
  .stage{
    position: relative;
    min-width: 0; min-height: 0;
    overflow: hidden;
    background: var(--ground);
    touch-action: none;
  }
  .stage canvas{ display: block; outline: none; }
  .labels{ position: absolute; inset: 0; pointer-events: none; z-index: 1; }
  .stage-msg{
    position: absolute; inset: 0; display: grid; place-items: center;
    padding: 24px; text-align: center; color: var(--ink-2); font-weight: 500; z-index: 0;
  }
  .stage-msg.err{ color: var(--warn); }

  .hud{
    position: absolute; z-index: 3;
    top: 12px; left: max(12px, env(safe-area-inset-left, 0px));
    display: flex; gap: 6px; flex-wrap: wrap;
  }
  .hud-btn{
    font-size: 12.5px; font-weight: 500; line-height: 1;
    background: color-mix(in srgb, var(--paper) 88%, transparent);
    color: var(--ink);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 8px 12px;
    cursor: pointer;
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
  }
  .hud-btn:hover{ border-color: var(--accent); }
  .hud-btn:disabled{ opacity: .55; cursor: default; border-color: var(--line); }
  .hint{
    position: absolute; z-index: 2; margin: 0;
    right: 12px; bottom: 12px;
    font-size: 11.5px; color: var(--ink-2);
    background: color-mix(in srgb, var(--paper) 80%, transparent);
    border-radius: 6px; padding: 4px 8px;
    pointer-events: none;
  }
  .inspector:not([hidden]) + .hint{ display: none; }

  /* 3D labels */
  .label{ display: flex; flex-direction: column; align-items: center; gap: 5px; }
  .tag{
    pointer-events: auto;
    display: inline-flex; align-items: center; gap: 5px;
    padding: 3px 9px 3px 7px;
    border-radius: 999px;
    background: color-mix(in srgb, var(--paper) 90%, transparent);
    border: 1px solid var(--line);
    box-shadow: 0 1px 3px rgba(0,0,0,.12);
    font: 400 12px/1.2 var(--f-display);
    color: var(--ink);
    white-space: nowrap;
    cursor: pointer;
  }
  .tag i{ width: 8px; height: 8px; border-radius: 50%; flex: none; }
  .tag b{ font-weight: 400; }
  .tag .tag-st{ font: 500 10.5px/1.2 var(--f-body); color: var(--ink-2); }
  .tag.sel{ border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
  .bubble{
    position: relative;
    max-width: 168px;
    padding: 6px 10px;
    border-radius: 10px;
    background: var(--raised);
    color: var(--ink);
    font: 500 12px/1.35 var(--f-body);
    text-align: center;
    box-shadow: var(--shadow);
    border: 1px solid var(--line);
    animation: pop .18s ease-out;
  }
  .bubble::after{
    content: ""; position: absolute; left: 50%; bottom: -6px;
    width: 10px; height: 10px; background: inherit;
    border-right: 1px solid var(--line); border-bottom: 1px solid var(--line);
    transform: translateX(-50%) rotate(45deg);
  }
  @keyframes pop{ from{ transform: translateY(4px) scale(.94); opacity: 0; } to{ transform: none; opacity: 1; } }

  /* inspector */
  .inspector{
    position: absolute; z-index: 3;
    left: max(12px, env(safe-area-inset-left, 0px)); bottom: 12px;
    width: min(300px, calc(100% - 24px));
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 12px;
    box-shadow: var(--shadow);
    padding: 14px;
    display: flex; flex-direction: column; gap: 10px;
  }
  .insp-head{ display: grid; grid-template-columns: 36px minmax(0,1fr) auto; gap: 10px; align-items: center; }
  .insp-head .ava{ grid-area: auto; align-self: center; }
  .insp-head b{ display: block; font-size: 15px; }
  .insp-head span.role{ font-size: 12px; color: var(--ink-3); }
  .icon-btn{
    width: 28px; height: 28px; border-radius: 8px; border: 1px solid var(--line);
    background: var(--raised); cursor: pointer; line-height: 1; font-size: 16px; color: var(--ink-2);
  }
  .insp-desc{ margin: 0; font-size: 12.5px; color: var(--ink-2); }
  .insp-grid{ display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 8px 12px; margin: 0; }
  .insp-grid .wide{ grid-column: 1 / -1; }
  .insp-grid dt{ font-size: 11px; color: var(--ink-3); }
  .insp-grid dd{ margin: 1px 0 0; font-size: 13px; overflow-wrap: anywhere; }
  .insp-grid dd.num{ font-family: var(--f-mono); font-variant-numeric: tabular-nums; }

  /* ---------- console ---------- */
  .panel{
    min-height: 0;
    overflow-y: auto;
    overscroll-behavior: contain;
    background: var(--paper);
    border-left: 1px solid var(--line);
    padding-block: 22px 32px;
    padding-left: 22px;
    padding-right: max(22px, env(safe-area-inset-right, 0px));
    display: flex; flex-direction: column; gap: 26px;
  }
  .brand-row{ display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .brand h1{ margin: 0; font: 400 25px/1.15 var(--f-display); letter-spacing: -0.01em; text-wrap: balance; }
  .live{ display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 500; color: var(--ok); white-space: nowrap; }
  .live i{ width: 7px; height: 7px; border-radius: 50%; background: var(--ok); animation: blink 2s infinite; }
  .lede{ margin: 8px 0 0; color: var(--ink-2); font-size: 13.5px; max-width: 46ch; }
  .stats{
    margin: 16px 0 0;
    display: grid; grid-template-columns: repeat(4, minmax(0,1fr));
    border: 1px solid var(--line); border-radius: 10px; background: var(--raised);
  }
  .stats > div{ padding: 9px 10px; min-width: 0; }
  .stats > div + div{ border-left: 1px solid var(--line); }
  .stats dt{ font-size: 11px; color: var(--ink-3); white-space: nowrap; }
  .stats dd{ margin: 2px 0 0; font: 500 16px/1.2 var(--f-mono); font-variant-numeric: tabular-nums; }

  .block h2{
    margin: 0 0 10px;
    font-size: 13.5px; font-weight: 600;
    display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap;
  }
  .block h2 .sub{ font-size: 12px; font-weight: 400; color: var(--ink-3); }

  .dispatch{ display: flex; gap: 8px; }
  #taskInput{
    flex: 1; min-width: 0;
    font-size: 14px;
    background: var(--raised);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 10px 12px;
  }
  #taskInput::placeholder{ color: var(--ink-3); }
  .btn-primary{
    flex: none;
    font-size: 13.5px; font-weight: 600;
    background: var(--accent); color: var(--accent-ink);
    border: 0; border-radius: 8px;
    padding: 0 16px;
    cursor: pointer;
  }
  .btn-primary:hover{ filter: brightness(1.08); }
  .chips{ display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .chip-btn{
    font-size: 12.5px; color: var(--ink-2);
    background: transparent;
    border: 1px dashed var(--line);
    border-radius: 999px;
    padding: 5px 10px;
    cursor: pointer;
  }
  .chip-btn:hover{ border-color: var(--accent); border-style: solid; color: var(--ink); }
  .controls{ display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-top: 14px; }
  .seg{ display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--raised); }
  .seg-label{ font-size: 12px; color: var(--ink-3); padding: 6px 4px 6px 10px; align-self: center; }
  .seg button{
    font: 500 12.5px/1 var(--f-mono);
    padding: 7px 11px;
    background: transparent; border: 0;
    color: var(--ink-2);
    cursor: pointer;
  }
  .seg button[aria-pressed="true"]{ background: var(--ink); color: var(--paper); }
  .switch{ position: relative; display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: var(--ink-2); cursor: pointer; user-select: none; }
  .switch input{ position: absolute; opacity: 0; width: 1px; height: 1px; }
  .track{ position: relative; width: 32px; height: 18px; border-radius: 999px; background: var(--line); transition: background .2s; flex: none; }
  .track::after{
    content: ""; position: absolute; top: 2px; left: 2px;
    width: 14px; height: 14px; border-radius: 50%;
    background: var(--raised); box-shadow: 0 1px 2px rgba(0,0,0,.25);
    transition: transform .2s;
  }
  .switch input:checked + .track{ background: var(--accent); }
  .switch input:checked + .track::after{ transform: translateX(14px); }
  .switch input:focus-visible + .track{ outline: 2px solid var(--accent); outline-offset: 2px; }

  /* roster */
  .roster{ list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
  .agent-row{
    display: grid;
    grid-template-columns: 34px minmax(0,1fr) auto;
    grid-template-areas: "ava who st" "ava cur tok";
    column-gap: 10px; row-gap: 5px;
    padding: 10px 8px;
    border-bottom: 1px solid var(--line);
    cursor: pointer;
  }
  .agent-row:hover{ background: color-mix(in srgb, var(--accent-soft) 55%, transparent); }
  .agent-row.sel{ background: var(--accent-soft); }
  .ava{
    grid-area: ava; align-self: start;
    width: 34px; height: 34px; border-radius: 10px;
    display: grid; place-items: center;
    font: 400 15px/1 var(--f-display);
  }
  .who{ grid-area: who; display: flex; align-items: baseline; gap: 6px; min-width: 0; }
  .who b{ font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; flex: 0 1 auto; }
  .who .role{ font-size: 12px; color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; flex: 0 100 auto; }
  .st{
    grid-area: st; align-self: center;
    font-size: 11.5px; font-weight: 500;
    padding: 2px 8px; border-radius: 999px; white-space: nowrap;
    color: var(--ink-3); box-shadow: inset 0 0 0 1px var(--line);
  }
  .st[data-s="work"]{ background: var(--ok-soft); color: var(--ok); box-shadow: none; }
  .st[data-s="handoff"]{ background: var(--warn-soft); color: var(--warn); box-shadow: none; }
  .st[data-s="meeting"]{ background: var(--accent-soft); color: var(--accent); box-shadow: none; }
  .st[data-s="walk"], .st[data-s="break"]{ color: var(--ink-2); }
  .cur{ grid-area: cur; min-width: 0; display: flex; flex-direction: column; gap: 5px; }
  .cur-text{ font-size: 12.5px; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bar{ height: 3px; border-radius: 2px; background: var(--line); overflow: hidden; }
  .bar i{ display: block; height: 100%; width: 0; background: var(--c, var(--accent)); }
  .tok{ grid-area: tok; align-self: end; font: 400 11.5px/1.2 var(--f-mono); color: var(--ink-3); font-variant-numeric: tabular-nums; }

  /* tasks */
  .tasks{ display: flex; flex-direction: column; gap: 8px; }
  .task{ border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; background: var(--raised); }
  .task[data-status="done"]{ background: transparent; }
  .task-top{ display: flex; align-items: baseline; gap: 8px; }
  .task h3{ margin: 0; flex: 1; min-width: 0; font-size: 13.5px; font-weight: 600; line-height: 1.35; overflow-wrap: anywhere; }
  .badge{ flex: none; font-size: 10.5px; font-weight: 500; padding: 1px 6px; border-radius: 4px; color: var(--ink-3); box-shadow: inset 0 0 0 1px var(--line); }
  .badge.ok{ color: var(--ok); box-shadow: none; background: var(--ok-soft); }
  .t-meta{ margin: 4px 0 0; font: 400 11.5px/1.3 var(--f-mono); color: var(--ink-3); font-variant-numeric: tabular-nums; }
  .pipe{ list-style: none; margin: 8px 0 0; padding: 0; display: flex; flex-wrap: wrap; gap: 4px; }
  .pipe li{
    display: inline-flex; align-items: center; gap: 4px;
    font-size: 11px; font-weight: 500; color: var(--ink-3);
    padding: 2px 7px 2px 6px; border-radius: 999px;
    box-shadow: inset 0 0 0 1px var(--line);
  }
  .pipe li::before{ content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--c); opacity: .4; }
  .pipe li.done{ color: var(--ink-2); box-shadow: none; background: color-mix(in srgb, var(--c) 14%, transparent); }
  .pipe li.done::before{ opacity: 1; }
  .pipe li.now{ color: var(--ink); box-shadow: inset 0 0 0 1.5px var(--c); }
  .pipe li.now::before{ opacity: 1; animation: blink 1.2s infinite; }
  .empty{ margin: 0; color: var(--ink-3); font-size: 13px; }

  /* log */
  .log{ list-style: none; margin: 0; padding: 0; font-size: 13px; }
  .log li{ display: grid; grid-template-columns: minmax(42px, auto) minmax(0,1fr); gap: 8px; padding: 6px 0; border-bottom: 1px dashed var(--line); }
  .log time{ font: 400 11.5px/1.6 var(--f-mono); color: var(--ink-3); font-variant-numeric: tabular-nums; }
  .log p{ margin: 0; color: var(--ink-2); overflow-wrap: anywhere; }
  .log .n{ font-weight: 600; }
  .log .ok{ color: var(--ok); font-weight: 600; }

  /* data source */
  .seg-src{ display: flex; width: 100%; }
  .seg-src button{ flex: 1; font: 500 13px/1 var(--f-body); padding: 9px 8px; }
  .src-card{ margin-top: 10px; display: flex; flex-direction: column; gap: 8px; font-size: 13px; color: var(--ink-2); }
  .src-card p{ margin: 0; }
  .src-status{ display: flex; align-items: center; gap: 8px; color: var(--ink); font-weight: 500; }
  .src-status.bad{ color: var(--warn); }
  .dot{ width: 8px; height: 8px; border-radius: 50%; background: var(--ink-3); flex: none; }
  .dot.ok{ background: var(--ok); }
  .dot.run{ background: var(--accent); animation: blink 1.4s infinite; }
  .dot.bad{ background: var(--warn); }
  .src-actions{ display: flex; gap: 6px; flex-wrap: wrap; }
  .btn-sm{
    font-size: 12.5px; font-weight: 500; padding: 6px 11px; border-radius: 7px;
    border: 1px solid var(--line); background: var(--raised); color: var(--ink); cursor: pointer;
  }
  .btn-sm:hover{ border-color: var(--accent); }
  .btn-sm.primary{ background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .btn-sm:disabled{ opacity: .55; cursor: default; }
  .dim{ color: var(--ink-3); }
  .how{ margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 4px; }
  code{ font: 400 12px/1.4 var(--f-mono); background: color-mix(in srgb, var(--line) 60%, transparent); padding: 1px 5px; border-radius: 4px; overflow-wrap: anywhere; }
  .src-card .bar{ height: 4px; }

  /* live dispatch */
  .repo-row{ display: flex; align-items: center; gap: 8px; margin-top: 10px; font-size: 13px; color: var(--ink-2); }
  .repo-row select{
    flex: 1; min-width: 0; font-size: 13px; background: var(--raised); color: var(--ink);
    border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px;
  }
  .confirm{ margin-top: 10px; padding: 10px 12px; border-radius: 10px; background: var(--warn-soft); color: var(--ink); font-size: 13px; display: flex; flex-direction: column; gap: 8px; }
  .confirm p{ margin: 0; }
  .d-msg{ margin: 10px 0 0; font-size: 12.5px; color: var(--ink-2); }
  .d-msg.bad{ color: var(--warn); }

  /* session cards */
  .t-sub{ margin: 4px 0 0; font-size: 12.5px; color: var(--ink-2); overflow-wrap: anywhere; }
  .t-link{ display: inline-block; margin-top: 8px; font-size: 12px; color: var(--accent); text-decoration: none; }
  .t-link:hover{ text-decoration: underline; }
  .badge.run{ color: var(--accent); background: var(--accent-soft); box-shadow: none; }
  .badge.warn{ color: var(--warn); background: var(--warn-soft); box-shadow: none; }
  .badge.bad{ color: var(--warn); box-shadow: inset 0 0 0 1px var(--warn); }
  .log .dim{ color: var(--ink-3); }
  .log .bad{ color: var(--warn); font-weight: 600; }
  .roster-empty{ padding: 14px 8px; color: var(--ink-3); font-size: 13px; border-bottom: 1px solid var(--line); }
  .bar.pulse i{ animation: blink 1.6s infinite; }
  .live[data-mode="sim"]{ color: var(--ink-2); }
  .live[data-mode="sim"] i{ background: var(--ink-3); animation: none; }
  .live[data-mode="file"]{ color: var(--accent); }
  .live[data-mode="file"] i{ background: var(--accent); }
  .insp-link{ margin: 0; font-size: 12.5px; }
  .insp-link a{ color: var(--accent); text-decoration: none; }
  .insp-link a:hover{ text-decoration: underline; }
  .stage.drop::after{
    content: "로그 파일을 놓으면 바로 재생해요";
    position: absolute; inset: 12px; z-index: 5;
    display: grid; place-items: center;
    border: 2px dashed var(--accent); border-radius: 14px;
    background: color-mix(in srgb, var(--paper) 80%, transparent);
    color: var(--ink); font-weight: 600; pointer-events: none;
  }

  @keyframes blink{ 0%,100%{ opacity: 1; } 50%{ opacity: .3; } }

  @media (max-width: 860px){
    .app{ grid-template-columns: minmax(0,1fr); grid-template-rows: minmax(240px, 50%) minmax(0,1fr); }
    .panel{
      border-left: 0; border-top: 1px solid var(--line);
      padding-block: 18px 28px;
      padding-left: max(16px, env(safe-area-inset-left, 0px));
      padding-right: max(16px, env(safe-area-inset-right, 0px));
      gap: 22px;
    }
    .hud{ right: max(12px, env(safe-area-inset-right, 0px)); }
    .hint{ display: none; }
    .tag .tag-st{ display: none; }

/* ================= navigation ================= */
const NAV = { x0: -11, z0: -7, cs: 0.4, nx: 55, nz: 35 };
NAV.block = new Uint8Array(NAV.nx * NAV.nz);
{
  const R = 0.3;
  for (let j = 0; j < NAV.nz; j++) for (let i = 0; i < NAV.nx; i++) {
    const x = NAV.x0 + (i + 0.5) * NAV.cs, z = NAV.z0 + (j + 0.5) * NAV.cs;
    let b = x < -10.65 || x > 10.75 || z < -6.65 || z > 6.75;
    for (let k = 0; !b && k < obstacles.length; k++) {
      const o = obstacles[k];
      b = o.t === 'r'
        ? x > o.x0 - R && x < o.x1 + R && z > o.z0 - R && z < o.z1 + R
        : Math.hypot(x - o.x, z - o.z) < o.r + R;
    }
    NAV.block[j * NAV.nx + i] = b ? 1 : 0;
  }
}
const cellOf = (x, z) => [clamp(Math.floor((x - NAV.x0) / NAV.cs), 0, NAV.nx - 1), clamp(Math.floor((z - NAV.z0) / NAV.cs), 0, NAV.nz - 1)];
const blocked = (i, j) => i < 0 || j < 0 || i >= NAV.nx || j >= NAV.nz || NAV.block[j * NAV.nx + i] === 1;
function nearestFree(i, j) {
  if (!blocked(i, j)) return [i, j];
  for (let r = 1; r < 10; r++) {
    let best = null, bd = Infinity;
    for (let dj = -r; dj <= r; dj++) for (let di = -r; di <= r; di++) {
      if (Math.max(Math.abs(di), Math.abs(dj)) !== r || blocked(i + di, j + dj)) continue;
      const d = di * di + dj * dj;
      if (d < bd) { bd = d; best = [i + di, j + dj]; }
    }
    if (best) return best;
  }
  return [i, j];
}
function astar(s, t) {
  const N = NAV.nx * NAV.nz;
  const g = new Float32Array(N).fill(Infinity), came = new Int32Array(N).fill(-1), closed = new Uint8Array(N);
  const si = s[1] * NAV.nx + s[0], ti = t[1] * NAV.nx + t[0];
  const heap = [];
  const push = (f, idx) => {
    heap.push([f, idx]);
    for (let k = heap.length - 1; k > 0;) { const p = (k - 1) >> 1; if (heap[p][0] <= heap[k][0]) break; [heap[p], heap[k]] = [heap[k], heap[p]]; k = p; }
  };
  const pop = () => {
    const top = heap[0], last = heap.pop();
    if (heap.length) {
      heap[0] = last;
      for (let k = 0; ;) {
        const l = 2 * k + 1, r = l + 1; let m = k;
        if (l < heap.length && heap[l][0] < heap[m][0]) m = l;
        if (r < heap.length && heap[r][0] < heap[m][0]) m = r;
        if (m === k) break;
        [heap[m], heap[k]] = [heap[k], heap[m]]; k = m;
      }
    }
    return top;
  };
  const h = (idx) => { const dx = Math.abs(idx % NAV.nx - t[0]), dz = Math.abs(((idx / NAV.nx) | 0) - t[1]); return Math.max(dx, dz) + 0.414 * Math.min(dx, dz); };
  g[si] = 0; push(h(si), si);
  while (heap.length) {
    const cur = pop()[1];
    if (cur === ti) break;
    if (closed[cur]) continue;
    closed[cur] = 1;
    const ci = cur % NAV.nx, cj = (cur / NAV.nx) | 0;
    for (let dj = -1; dj <= 1; dj++) for (let di = -1; di <= 1; di++) {
      if (!di && !dj) continue;
      const ni = ci + di, nj = cj + dj;
      if (blocked(ni, nj) || (di && dj && (blocked(ci + di, cj) || blocked(ci, cj + dj)))) continue;
      const nidx = nj * NAV.nx + ni, ng = g[cur] + (di && dj ? 1.414 : 1);
      if (ng < g[nidx]) { g[nidx] = ng; came[nidx] = cur; push(ng + h(nidx), nidx); }
    }
  }
  if (si !== ti && came[ti] === -1) return null;
  const out = [];
  for (let c = ti; c !== -1 && c !== si; c = came[c]) out.push(c);
  return out.reverse();
}
function findPath(sx, sz, tx, tz) {
  const cells = astar(nearestFree(...cellOf(sx, sz)), nearestFree(...cellOf(tx, tz)));
  const pts = [{ x: sx, z: sz }];
  if (cells) for (const c of cells) pts.push({ x: NAV.x0 + (c % NAV.nx + 0.5) * NAV.cs, z: NAV.z0 + (((c / NAV.nx) | 0) + 0.5) * NAV.cs });
  pts.push({ x: tx, z: tz });
  const A = pts[0], Z = pts[pts.length - 1];
  const clear = (p, q) => {
    const n = Math.ceil(Math.hypot(q.x - p.x, q.z - p.z) / 0.15);
    for (let k = 1; k < n; k++) {
      const x = p.x + (q.x - p.x) * k / n, z = p.z + (q.z - p.z) * k / n;
      if (Math.hypot(x - A.x, z - A.z) < 0.6 || Math.hypot(x - Z.x, z - Z.z) < 0.6) continue;
      if (blocked(...cellOf(x, z))) return false;
    }
    return true;
  };
  const out = [];
  for (let i = 0; i < pts.length - 1;) {
    let j = pts.length - 1;
    while (j > i + 1 && !clear(pts[i], pts[j])) j--;
    out.push(pts[j]); i = j;
  }
  return out;
}

let pickables = [];

function buildAgentModel(def) {
  const g = new THREE.Group();
  const col = new THREE.Color(def.hex);
  const bodyMat = std(col, 0.55);
  const legMat = std(col.clone().multiplyScalar(0.5), 0.7);
  const headMat = std(0xf3f4f0, 0.35);
  const visorMat = std(0x161b22, 0.2, 0.3);
  const eyeMat = new THREE.MeshBasicMaterial({ color: col.clone().lerp(new THREE.Color(0xffffff), 0.45) });
  const tipMat = new THREE.MeshStandardMaterial({ color: col, emissive: col, emissiveIntensity: 0.4 });
  const docMat = new THREE.MeshStandardMaterial({ color: 0xffffff, emissive: col, emissiveIntensity: 0.3 });

  const legGeo = new THREE.CapsuleGeometry(0.075, 0.3, 4, 8);
  const mkLimb = (geo, mat, x, y, len) => {
    const pivot = new THREE.Group(); pivot.position.set(x, y, 0);
    add(pivot, geo, mat, 0, -len / 2, 0); g.add(pivot);
    return pivot;
  };
  const legL = mkLimb(legGeo, legMat, -0.1, 0.5, 0.45);
  const legR = mkLimb(legGeo, legMat, 0.1, 0.5, 0.45);
  const torso = add(g, new THREE.CapsuleGeometry(0.21, 0.3, 6, 14), bodyMat, 0, 0.87, 0);
  const armGeo = new THREE.CapsuleGeometry(0.06, 0.3, 4, 8);
  const armL = mkLimb(armGeo, bodyMat, -0.28, 1.1, 0.42);
  const armR = mkLimb(armGeo, bodyMat, 0.28, 1.1, 0.42);
  const head = new THREE.Group(); head.position.y = 1.44; g.add(head);
  add(head, new THREE.SphereGeometry(0.22, 22, 16), headMat);
  const visor = add(head, new THREE.CapsuleGeometry(0.075, 0.16, 4, 12), visorMat, 0, 0, 0.19, { cast: false });
  visor.rotation.z = Math.PI / 2; visor.scale.set(1, 1, 0.6);
  const eyes = new THREE.Group(); eyes.position.set(0, 0.004, 0.236); head.add(eyes);
  for (const ex of [-0.065, 0.065]) add(eyes, new THREE.SphereGeometry(0.028, 10, 8), eyeMat, ex, 0, 0, { cast: false });
  add(head, new THREE.CylinderGeometry(0.012, 0.012, 0.14, 6), MAT.metal, 0, 0.27, 0);
  const tip = add(head, new THREE.SphereGeometry(0.036, 12, 10), tipMat, 0, 0.35, 0);
  const doc = add(g, new THREE.BoxGeometry(0.24, 0.32, 0.02), docMat, 0, 0.98, 0.3);
  doc.rotation.x = -0.35; doc.visible = false;
  return { g, legL, legR, armL, armR, torso, head, eyes, tip, tipMat, doc, mats: [bodyMat, legMat, headMat, visorMat, eyeMat, tipMat, docMat] };
}

function createAgent(def, slot, opts = {}) {
  const m = buildAgentModel(def);
  const start = opts.at || slot.seat;
  const h0 = opts.at ? angleTo(opts.at, slot.seat) : slot.h;
  m.g.position.set(start.x, 0, start.z);
  m.g.rotation.y = h0;
  scene.add(m.g);

  const label = document.createElement('div');
  label.className = 'label';
  const bubble = document.createElement('div');
  bubble.className = 'bubble'; bubble.hidden = true;
  const tag = document.createElement('button');
  tag.type = 'button'; tag.className = 'tag'; tag.tabIndex = -1;
  const dot = document.createElement('i'); dot.style.background = def.hex;
  const nameEl = document.createElement('b'); nameEl.textContent = def.name;
  const stEl = document.createElement('span'); stEl.className = 'tag-st'; stEl.textContent = '대기';
  tag.append(dot, nameEl, stEl);
  label.append(bubble, tag);
  const lobj = new CSS2DObject(label);
  lobj.position.set(0, 1.98, 0);

  m.g.add(lobj);

  const a = {
    def, ...m, desk: slot,
    pos: m.g.position, heading: h0, headingTarget: h0,
    seated: !opts.at, moving: false, typing: false,
    action: null, actionKind: null, queue: [],
    inbox: [], job: null, outbox: [],
    tokens: 0, doneCount: 0, toolCount: 0, lastBreak: simTime - rand(0, 20), atMeeting: false, poi: null,
    walkPhase: 0, animT: rand(0, 10), blinkT: rand(2, 5), bubbleT: 0,
    bubble, tag, tagName: nameEl, tagSt: stEl, lastSt: '', label: lobj,
    removed: false, lastAct: 0, cur: null, deliver: null, leaving: false, done: false, isChild: false, session: null,
  };
  tag.addEventListener('click', () => select(a, true));
  m.g.traverse((o) => { if (o.isMesh) { o.userData.agent = a; pickables.push(o); } });
  slot.owner = a;
  agents.push(a);
  byId[def.id] = a;
  rosterDirty = true;
  return a;
}
function removeAgent(a) {
  if (a.removed) return;
  a.removed = true;
  releasePoi(a);
  if (a.desk.owner === a) a.desk.owner = null;
  if (selected === a) select(null);
  // 그룹만 빼면 CSS2D 이름표가 화면에 남아서, 이름표를 먼저 떼어 내요
  a.label.removeFromParent();
  a.label.element.remove();
  scene.remove(a.g);
  a.g.traverse((o) => { if (o.isMesh) o.geometry.dispose(); });
  a.mats.forEach((mt) => mt.dispose());
  pickables = pickables.filter((p) => p.userData.agent !== a);
  agents.splice(agents.indexOf(a), 1);

  rosterDirty = true;
}
function renameAgent(a, full) {
  a.def.full = full;
  a.def.name = cut(full, 9);
  a.tagName.textContent = a.def.name;
  rosterDirty = true;
}
const freeSlot = () => SLOTS.find((s) => !s.owner && s.kind === 'desk') || SLOTS.find((s) => !s.owner) || null;

let speed = 1;

  a.bubble.textContent = text;
  a.bubble.hidden = false;
  a.bubble.style.animation = 'none'; void a.bubble.offsetWidth; a.bubble.style.animation = '';

/* ================= mode ================= */
let mode = 'sim';          // 'sim' 시뮬레이션 | 'live' 실시간 | 'file' 로그 재생
let liveSrc = null;        // 'ccr' (claude.ai 커넥터) | 'bridge' (로컬 브리지)
let warming = false;

/* ================= simulation (demo) ================= */
let simTime = 0, taskSeq = 0, totalTokens = 0, doneTotal = 0;
const tasks = [];
const meeting = { active: false, phase: '', t: 0, turn: 0, order: [] };
let boardDirty = true, tasksDirty = true;

const KW = {
  fix: /버그|오류|에러|수정|장애/,
  research: /조사|리서치|분석|비교|시장|트렌드|경쟁|자료|검색|요약|보고서/,
  design: /디자인|UI|UX|화면|시안|로고|배너|랜딩|페이지|아이콘|브랜드|썸네일|온보딩/i,
  code: /개발|구현|코드|API|버그|오류|에러|수정|기능|앱|자동화|스크립트|페이지|서버|배포|로그인|연동|속도|추가/i,
};
const mkStage = (a, label, w, kind = 'make') => ({ a, label, kind, dur: w * rand(0.85, 1.2), done: false, started: false });
function planStages(title) {
  const fix = KW.fix.test(title), r = KW.research.test(title) && !fix, d = KW.design.test(title), c = KW.code.test(title);
  const st = [mkStage('maru', '작업 분해', 5, 'plan')];
  if (r || (!d && !c)) st.push(mkStage('sori', d || c ? '자료 조사' : '조사·정리', d || c ? 8 : 12));
  if (d) st.push(mkStage('miru', '시안 제작', 10));
  if (c) st.push(mkStage('koda', fix ? '원인 분석·수정' : '구현', 11));
  st.push(mkStage('bareun', '리뷰', 6, 'review'));
  if (c || d) st.push(mkStage('haesol', c ? '테스트' : '접근성 점검', 7, 'qa'));
  st.push(mkStage('maru', '결과 보고', 3, 'report'));
  return st;
}
const makeJob = (task, idx) => ({ task, idx, stage: task.stages[idx], progress: 0 });

function dispatch(rawTitle, opts = {}) {
  const title = String(rawTitle).trim().replace(/\s+/g, ' ').slice(0, 60);
  if (!title || !byId.maru) return false;
  const task = { id: ++taskSeq, title, stages: planStages(title), stageIdx: 0, status: 'open', createdAt: simTime, tokens: 0, example: !!opts.example, reworked: false };
  tasks.push(task);
  byId.maru.inbox.push(makeJob(task, 0));
  interrupt(byId.maru, 'job');
  const q = `‘${esc(title)}’`;
  if (opts.example) log(`예시 작업 ${q}${josa(title, '을/를')} 넣어 뒀어요`);
  else if (opts.auto) log(`새 요청 ${q}${josa(title, '이/가')} 들어왔어요`);
  else log(`${q} 작업을 ${nameHTML(byId.maru)}에게 맡겼어요`);
  boardDirty = tasksDirty = true;
  return true;
}

function finishJob(a) {
  const job = a.job; a.job = null;
  const task = job.task, st = job.stage;
  st.done = true;
  a.doneCount++;
  const q = `‘${esc(cut(task.title, 16))}’`;
  if (st.kind === 'plan') {
    const chain = task.stages.slice(1, -1).map((s) => AGENT_DEFS.find((d) => d.id === s.a).name).join(' → ');
    log(`${nameHTML(a, '이/가')} ${q}${josa(task.title, '을/를')} ${task.stages.length}단계로 나눴어요 · ${chain}`);
  } else if (st.kind === 'review') {
    const producer = task.stages.slice(0, job.idx).reverse().find((s) => s.a === 'koda' || s.a === 'miru');
    if (producer && !task.reworked && Math.random() < 0.4) {
      task.reworked = true;
      task.stages.splice(job.idx + 1, 0, mkStage(producer.a, '수정 반영', 5, 'fix'), mkStage('bareun', '재검토', 3.5, 'review2'));
      log(`${nameHTML(a, '이/가')} ${q}에 수정 요청 ${randInt(2, 4)}건을 남겼어요`);
    } else log(`${nameHTML(a, '이/가')} ${q} 리뷰를 승인했어요`);
  } else if (st.kind === 'review2') {
    log(`${nameHTML(a, '이/가')} 수정된 ${q}${josa(task.title, '을/를')} 승인했어요`);
  } else if (st.kind === 'qa') {
    log(`${nameHTML(a, '이/가')} ${q} ${st.label} ${randInt(12, 48)}건을 모두 통과시켰어요`);
  }
  const next = job.idx + 1;
  if (next >= task.stages.length) {
    completeTask(task, a);
  } else {
    task.stageIdx = next;
    const to = byId[task.stages[next].a];
    if (to === a) a.inbox.push(makeJob(task, next));
    else a.outbox.push({ task, idx: next, to, from: a });
  }
  boardDirty = tasksDirty = true;
}

function completeTask(task, a) {
  task.status = 'done';
  task.doneAt = simTime;
  doneTotal++;
  log(`<span class="ok">완료</span> ‘${esc(task.title)}’ · ${fmtDur(simTime - task.createdAt)} · ${fmtTok(task.tokens)} 토큰`);
  say(a, '완료 보고 드려요!', 2.6);
  burst(a.pos);
}

function receive(h) {
  const to = h.to;
  if (!to || to.removed) return;
  to.inbox.push(makeJob(h.task, h.idx));
  say(to, pick(['받았어요!', '바로 볼게요', '네, 시작할게요']), 2.2);
  log(`${nameHTML(h.from)} → ${nameHTML(to)} · ‘${esc(cut(h.task.title, 14))}’ ${h.task.stages[h.idx].label}`);
  interrupt(to, 'job');
  boardDirty = tasksDirty = true;
}

/* ---- per-agent behaviour: a queue of small actions, refilled by think() / thinkLive() ---- */
const walk = (x, z, h) => ({ t: 'walk', x, z, h });
const atSeat = (a) => Math.hypot(a.pos.x - a.desk.seat.x, a.pos.z - a.desk.seat.z) < 0.08;
function plan(a, kind, ...acts) {
  for (const act of acts) if (act) { act.kind = kind; a.queue.push(act); }
}
function releasePoi(a) { if (a.poi) { a.poi.by = null; a.poi = null; } }
function interrupt(a, why) {
  if (!a.action && !a.queue.length) return;
  if (why === 'job' && a.actionKind !== 'idle') return;
  if (why === 'meeting' && (a.actionKind === 'meeting' || a.actionKind === 'leave' || a.action?.t === 'deliver' || a.action?.t === 'give')) return;
  a.action = null; a.queue.length = 0;
  releasePoi(a);
}
function meetSpot(a) {
  const idx = agents.indexOf(a);
  if (idx >= 0 && idx < MEET_SEATS.length) return { ...MEET_SEATS[idx], sit: true };
  const ang = (idx - MEET_SEATS.length) * 0.62 + 0.3, r = 2.45;
  const x = MEET.x + r * Math.sin(ang), z = MEET.z + r * Math.cos(ang);
  return { x, z, h: ang + Math.PI, sit: false };
}
function goMeeting(a) {
  if (!a.atMeeting) {
    const s = meetSpot(a);
    plan(a, 'meeting', walk(s.x, s.z, s.h), s.sit ? { t: 'sit', h: s.h } : null, { t: 'call', fn: () => { a.atMeeting = true; } }, { t: 'meet' });
  } else plan(a, 'meeting', { t: 'meet' });
}
function planIdle(a, breakChance) {
  const seat = a.desk.seat;
  if (!atSeat(a)) { plan(a, 'idle', walk(seat.x, seat.z, a.desk.h), { t: 'sit', h: a.desk.h }); return; }
  if (!a.seated) { plan(a, 'idle', { t: 'sit', h: a.desk.h }); return; }
  if (simTime - a.lastBreak > 24 && Math.random() < breakChance) {
    const free = POIS.filter((p) => !p.by);
    if (free.length) {
      const p = pick(free);
      p.by = a; a.poi = p; a.lastBreak = simTime;
      plan(a, 'idle',
        walk(p.x, p.z, p.h), p.sit ? { t: 'sit', h: p.h } : null,
        { t: 'say', text: pick(p.lines) }, { t: 'wait', d: rand(5, 9) },
        { t: 'call', fn: () => releasePoi(a) },
        walk(seat.x, seat.z, a.desk.h), { t: 'sit', h: a.desk.h });
      return;
    }
  }
  plan(a, 'idle', { t: 'wait', d: rand(2.5, 6) });
}
function think(a) {
  if (meeting.active) { goMeeting(a); return; }
  a.atMeeting = false;
  const seat = a.desk.seat;
  if (a.outbox.length) {
    const h = a.outbox[0], sp = h.to.desk.handoff;
    plan(a, 'handoff', walk(sp.x, sp.z, angleTo(sp, h.to.desk.seat)), { t: 'deliver', h });
    return;
  }
  if (a.job || a.inbox.length) {
    if (!a.job) { a.job = a.inbox.shift(); a.job.stage.started = true; boardDirty = tasksDirty = true; }
    plan(a, 'work', atSeat(a) ? null : walk(seat.x, seat.z, a.desk.h), { t: 'sit', h: a.desk.h }, { t: 'work' });
    return;
  }
  planIdle(a, 0.4);
}
function thinkLive(a) {
  if (meeting.active && !a.leaving) { goMeeting(a); return; }
  a.atMeeting = false;
  if (a.leaving) { plan(a, 'leave', walk(DOOR.x, DOOR.z), { t: 'call', fn: () => removeAgent(a) }); return; }
  if (a.deliver) {
    const to = a.deliver.to;
    if (!to || to.removed) { const d = a.deliver; a.deliver = null; if (d.then === 'leave') a.leaving = true; return; }
    const sp = to.desk.handoff;
    plan(a, 'handoff', walk(sp.x, sp.z, angleTo(sp, to.desk.seat)), { t: 'give' });
    return;
  }
  if (liveBusy(a)) {
    const seat = a.desk.seat;
    plan(a, 'work', atSeat(a) ? null : walk(seat.x, seat.z, a.desk.h), { t: 'sit', h: a.desk.h }, { t: 'live' });
    return;

  else if (act.t === 'deliver') { act.left = 1.2; say(a, `${act.h.task.stages[act.h.idx].label} 부탁해요`, 2.2); }
  else if (act.t === 'give') { act.left = 1.3; say(a, a.deliver?.say || '전달할게요', 2.2); }

function runAction(a, act, dt) {
  switch (act.t) {

      while (left > 0 && act.path.length) {
        const p = act.path[0], dx = p.x - a.pos.x, dz = p.z - a.pos.z, d = Math.hypot(dx, dz);

}
function updateAgent(a, dt) {

function wrapAngle(x) { return Math.atan2(Math.sin(x), Math.cos(x)); }

const CONF_N = 90;
const conf = new THREE.InstancedMesh(new THREE.PlaneGeometry(0.07, 0.11), new THREE.MeshBasicMaterial({ side: THREE.DoubleSide }), CONF_N);
conf.frustumCulled = false;

const confP = [];
const dummy = new THREE.Object3D();
const confColors = PALETTE.map((p) => new THREE.Color(p.hex));
for (let i = 0; i < CONF_N; i++) {
  confP.push({ p: new THREE.Vector3(), v: new THREE.Vector3(), r: new THREE.Vector3(), life: 0 });
  conf.setColorAt(i, confColors[i % confColors.length]);
  dummy.scale.setScalar(0); dummy.updateMatrix(); conf.setMatrixAt(i, dummy.matrix);
}
let confNext = 0;
function burst(at) {
  if (reduceMotion || warming) return;
  for (let k = 0; k < 45; k++) {
    const c = confP[confNext]; confNext = (confNext + 1) % CONF_N;
    c.p.set(at.x, 2.0, at.z);
    c.v.set(rand(-1.6, 1.6), rand(2.5, 4.5), rand(-1.6, 1.6));
    c.r.set(rand(0, 6), rand(0, 6), rand(0, 6));

function updateConfetti(dt) {
  let any = false;
  for (let i = 0; i < CONF_N; i++) {
    const c = confP[i];
    if (c.life <= 0) continue;
    any = true;
    c.life -= dt;
    if (c.p.y > 0.02) { c.v.y -= 6 * dt; c.v.multiplyScalar(0.985); c.p.addScaledVector(c.v, dt); c.r.x += dt * 6; c.r.y += dt * 4; }
    else c.p.y = 0.02;
    dummy.position.copy(c.p); dummy.rotation.set(c.r.x, c.r.y, c.r.z);
    dummy.scale.setScalar(c.life > 0 ? Math.min(1, c.life * 2) : 0);
    dummy.updateMatrix(); conf.setMatrixAt(i, dummy.matrix);
  }

  if (any) conf.instanceMatrix.needsUpdate = true;
}

const ROOM_CORNERS = [];
for (const x of [-11, 11]) for (const z of [-7, 7]) ROOM_CORNERS.push(new THREE.Vector3(x, 0, z));

// 화면 비율에 맞춰 방 전체가 들어오는 거리를 찾는다 (가로로 넓으면 정면에 가깝게, 세로로 길면 대각선으로)
function homeView() {
  const wide = camera.aspect > 1.25;
  const az = wide ? 0.5 : 0.72, el = wide ? 0.72 : 0.78;
  const target = new THREE.Vector3(wide ? 0 : -0.4, 0, wide ? -0.6 : -0.2);
  const dir = new THREE.Vector3(Math.sin(az) * Math.cos(el), Math.sin(el), Math.cos(az) * Math.cos(el));
  const cam = camera.clone();
  const fits = (d) => {
    cam.position.copy(target).addScaledVector(dir, d);
    cam.lookAt(target); cam.updateMatrixWorld(); cam.updateProjectionMatrix();
    return ROOM_CORNERS.every((c) => { const v = c.clone().project(cam); return Math.abs(v.x) < 0.97 && Math.abs(v.y) < 0.9; });
  };
  let lo = 6, hi = 80;
  for (let i = 0; i < 24; i++) { const mid = (lo + hi) / 2; if (fits(mid)) hi = mid; else lo = mid; }
  return { p: target.clone().addScaledVector(dir, hi), t: target };
}

}

    const done = tasks.filter((t) => t.status === 'done').slice(-4).reverse();
    const list = [...open, ...done];
    if (!list.length) { tasksEl.innerHTML = '<p class="empty">진행 중인 작업이 없어요. 위에서 작업을 지시하면 마루가 바로 받아요.</p>'; return; }
    tasksEl.innerHTML = list.map((t) => {
      const isDone = t.status === 'done';
      const pipe = t.stages.map((s, i) => {
        const ag = AGENT_DEFS.find((d) => d.id === s.a);
        const cls = s.done ? 'done' : (!isDone && i === t.stageIdx ? 'now' : '');
        return `<li class="${cls}" style="--c:${ag.hex}" title="${ag.name} · ${s.label}">${s.label}</li>`;
      }).join('');
      const badge = isDone ? '<span class="badge ok">완료</span>' : t.example ? '<span class="badge">예시</span>' : '';
      const elapsed = (isDone ? t.doneAt : simTime) - t.createdAt;
      return `<article class="task" data-status="${isDone ? 'done' : 'open'}">
        <div class="task-top"><h3>${esc(t.title)}</h3>${badge}</div>
        <p class="t-meta">${isDone ? '소요' : '경과'} ${fmtDur(elapsed)} · ${fmtTok(t.tokens)} 토큰</p>
        <ol class="pipe" aria-label="단계">${pipe}</ol>
      </article>`;
    }).join('');
    return;
  }
  const order = { working: 0, blocked: 1, review_ready: 2, failed: 3, completed: 4 };
  const ss = visibleSessions().sort((x, y) => (order[sessionBucket(x)] ?? 5) - (order[sessionBucket(y)] ?? 5) || (y.updatedAt || y.lastAct) - (x.updatedAt || x.lastAct)).slice(0, 10);
  if (!ss.length) {
    const msg = mode === 'file' ? '파일을 불러오면 기록 속 세션이 여기에 나타나요.'
      : liveSrc === 'ccr' ? (ccr.everLoaded ? 'Claude Code 세션이 아직 없어요. 위에서 작업을 맡기면 새 세션이 생겨요.' : '세션을 불러오는 중이에요…')
      : '아직 기록이 없어요. 이 컴퓨터에서 Claude Code를 실행하면 여기에 나타나요.';
    tasksEl.innerHTML = `<p class="empty">${msg}</p>`;
    return;
  }
  tasksEl.innerHTML = ss.map((S) => {
    const b = sessionBucket(S);
    const cls = b === 'working' ? 'run' : b === 'completed' ? 'ok' : b === 'failed' ? 'bad' : 'warn';
    const meta = [relTime(S.updatedAt || S.lastAct), (S.usageOut || S.tokensSeen) ? `출력 ${fmtTok(S.usageOut || S.tokensSeen)} 토큰` : '', S.cost ? `$${S.cost.toFixed(2)}` : '', S.toolCount ? `도구 ${S.toolCount}회` : ''].filter(Boolean).join(' · ');
    const subText = S.prompt ? `최근 요청 · “${cut(S.prompt, 90)}”` : S.summary;
    const pipe = S.tools.map((t) => `<li class="done" style="--c:${t.hex}">${esc(t.label)}</li>`).join('');
    return `<article class="task" data-status="${b === 'completed' ? 'done' : 'open'}">
      <div class="task-top"><h3>${esc(S.title || '세션')}</h3><span class="badge ${cls}">${BUCKETS[b] || b}</span></div>
      ${subText ? `<p class="t-sub">${esc(subText)}</p>` : ''}
      ${meta ? `<p class="t-meta">${esc(meta)}</p>` : ''}
      ${pipe ? `<ol class="pipe" aria-label="최근 도구">${pipe}</ol>` : ''}
      ${S.url ? `<a class="t-link" href="${esc(S.url)}" target="_blank" rel="noopener">세션 열기 ↗</a>` : ''}
    </article>`;
  }).join('');
}

const clock = new THREE.Clock();
let uiT = 0, taskT = 0, srcT = 0;
function frame() {
  const rdt = Math.min(clock.getDelta(), 0.1);
  step(rdt * (mode === 'live' ? 1 : speed));

  for (const a of agents) {
    if (a.bubbleT > 0) { a.bubbleT -= rdt; if (a.bubbleT <= 0) a.bubble.hidden = true; }
    a.blinkT -= rdt;
    a.eyes.scale.y = a.blinkT < 0.12 ? 0.15 : 1;
    if (a.blinkT <= 0) a.blinkT = rand(2.5, 5.5);
  }
  updateScreens(rdt);
  updateConfetti(rdt);
  updateLeds(rdt);

  if (selected) {
    ring.position.set(selected.pos.x, 0.02, selected.pos.z);
    const s = 1 + Math.sin(performance.now() / 300) * 0.06;
    ring.scale.set(s, s, s);
  }
  if (camTween) {
    camTween.k = Math.min(1, camTween.k + rdt / camTween.dur);
    const e = camTween.k < 0.5 ? 2 * camTween.k * camTween.k : 1 - Math.pow(-2 * camTween.k + 2, 2) / 2;
    camera.position.lerpVectors(camTween.p0, camTween.p, e);
    controls.target.lerpVectors(camTween.t0, camTween.t, e);
    if (camTween.k >= 1) camTween = null;
  } else if (follow && selected) {
    const d = new THREE.Vector3(selected.pos.x, 0.8, selected.pos.z).sub(controls.target).multiplyScalar(Math.min(1, rdt * 4));
    controls.target.add(d); camera.position.add(d);
  }
  controls.target.set(clamp(controls.target.x, -12, 12), clamp(controls.target.y, 0, 3), clamp(controls.target.z, -8, 8));
  controls.update();

  uiT -= rdt; taskT -= rdt; srcT -= rdt;
  if (uiT <= 0 || rosterDirty) { uiT = 0.25; renderUI(); }
  if (taskT <= 0 || (tasksDirty && taskT < 0.75)) { taskT = 1; renderTasks(); }
  if (boardDirty) { boardDirty = false; drawBoard(); }
  if (srcT <= 0) {
    srcT = 0.5;
    if (mode === 'file' && replay.items.length) {
      const p = $('#srcProgress'), bar = $('#srcBar');
      const doneAll = replay.i >= replay.items.length;
      if (p) p.textContent = `${cut(replay.name, 40)} · ${doneAll ? '재생 끝' : '재생 중'} · ${replay.i}/${replay.items.length}`;
      if (bar) bar.style.width = `${Math.round((replay.i / replay.items.length) * 100)}%`;
      if (doneAll && !replay.ended) { replay.ended = true; renderSource(); }
      if (!doneAll) replay.ended = false;
    }
    const ago = $('#srcAgo');
    if (ago) ago.textContent = relTime(ccr.lastOk);
  }

  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
}
renderer.setAnimationLoop(frame);
$('#stageMsg').hidden = true;
window.__officeReady = true;
</script>
</body>
</html>
