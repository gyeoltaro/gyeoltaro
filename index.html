<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>랜덤인생게임</title>
<style>
  :root{
    --bg:#f5f2ea; --surface:#fff; --ink:#1f1d19; --soft:#58534a; --muted:#8c8578;
    --line:#ddd6c6; --accent:#a8742a; --accent-soft:#efe0c3; --good:#3c7a4f; --bad:#a53f3f;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#14120f; --surface:#1e1b16; --ink:#ede7da; --soft:#c3bba9; --muted:#8a8170;
      --line:#383025; --accent:#d3a352; --accent-soft:#33290f; --good:#7fbd93; --bad:#d98080; }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans KR","Malgun Gothic",system-ui,sans-serif;line-height:1.6}
  .wrap{max-width:640px;margin:0 auto;padding:28px 16px 64px}
  h1{font-size:26px;margin:0 0 4px}
  .sub{color:var(--muted);font-size:14px;margin:0 0 24px}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;margin-bottom:16px}
  .card h2{font-size:15px;color:var(--accent);margin:0 0 8px;letter-spacing:.02em}
  .big{font-size:22px;font-weight:700;margin:2px 0 6px}
  button{font:inherit;cursor:pointer}
  .btn{display:block;width:100%;text-align:left;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-top:8px}
  .btn:hover,.btn:focus-visible{border-color:var(--accent);background:var(--accent-soft);outline:none}
  .primary{background:var(--accent);color:#fff;border:0;text-align:center;font-weight:700;padding:14px}
  .primary:hover{background:var(--accent);filter:brightness(1.1)}
  .stats{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:16px}
  .stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px;text-align:center;font-size:12px;color:var(--soft)}
  .stat b{display:block;font-size:17px;color:var(--ink)}
  .bar{height:4px;background:var(--line);border-radius:2px;margin-top:4px;overflow:hidden}
  .bar i{display:block;height:100%;background:var(--accent)}
  .age{font-size:13px;color:var(--muted);margin-bottom:4px}
  .res{border-left:3px solid var(--accent);padding:4px 12px;margin:12px 0;color:var(--soft)}
  .log{font-size:14px;color:var(--soft);margin:0;padding:0;list-style:none}
  .log li{padding:5px 0;border-bottom:1px dashed var(--line)}
  .log li span{color:var(--accent);font-weight:700;margin-right:8px;font-variant-numeric:tabular-nums}
  .tag{display:inline-block;font-size:12px;background:var(--accent-soft);color:var(--accent);border-radius:99px;padding:2px 10px;margin:0 4px 4px 0}
  .fx{font-size:12px;color:var(--muted);margin-top:6px}
  .note{font-size:12px;color:var(--muted);margin-top:24px}
  .btn.locked{opacity:.55;border-style:dashed;cursor:not-allowed}
  .btn.locked:hover{background:var(--surface);border-color:var(--line)}
  canvas{width:100%;height:auto;border-radius:12px;border:1px solid var(--line);display:block}
  .row{display:flex;gap:8px}.row .btn{text-align:center}
  .roll{font-variant-numeric:tabular-nums}
  @media (max-width:420px){.stats{grid-template-columns:repeat(3,1fr)}}
</style>
</head>

function weightedBirth(){
  const total=COUNTRIES.reduce((s,c)=>s+c[5],0);
  let x=rnd()*total;
  for(const c of COUNTRIES){ x-=c[5]; if(x<=0) return c; }
  return COUNTRIES[0];
}
function newLife(seed){
  rnd=seed?mulberry(seed):Math.random;
  const c=weightedBirth();
  const [iso,en,ko,reg,inc,births,le,imr,gdp]=c;
  const sex=rnd()<0.512?"남":"여";
  const base=[14,30,50,72][inc];
  const fam=clamp(Math.round(base+randn()*17));
  const famTier=fam<25?0:fam<48?1:fam<70?2:3;
  // 수명: 영아기 사망 → 아니면 기대수명 기반
  const imrP=(imr==null?[45,25,12,4][inc]:imr)/1000;
  let lifespan;
  if(rnd()<imrP) lifespan=Math.floor(rnd()*2);
  else if(rnd()<0.09+ (3-inc)*0.02) lifespan=Math.floor(2+rnd()*Math.max(8,le-5)); // 사고·질병·분쟁 등 이른 죽음
  else lifespan=Math.round(clamp(le+7+randn()*10,15,108));
  if(sex==="여") lifespan=Math.min(110,lifespan+ (lifespan>20?2:0));
  const parents=[
    ["농사·일용직","시장 노점","가사·돌봄 노동"],
    ["공장 노동자","소규모 자영업","운전·배달","간호·돌봄"],
    ["회사원","교사","공무원","중소기업 운영"],
    ["전문직","대기업 임원","연구자·의사","사업가"]
  ][famTier];
  const parent=pick(parents);
  rnd=Math.random;
  return {
    daily:!!seed, seed:seed||0, locked:[], bio:[], date:seed?todayStr():"",
    c, sex, fam, famTier, lifespan, parent, age:0, stageIdx:0,
    s:{h:clamp(60+randn()*10+(inc-1.5)*4),w:clamp(fam),j:clamp(55+randn()*8),r:clamp(50+randn()*12),e:clamp(fam*0.4+10)},
    log:[], seen:new Set(), cause:"", tags:[]
  };
}

    <div class="card">
      <h2>어떻게 정해지나요</h2>
      <p>출생지는 세계은행 통계로 계산한 <b>국가별 연간 출생 수</b>에 비례해 뽑힙니다. 아이가 많이 태어나는 나라일수록 당첨 확률이 높습니다. 성별과 가정 형편은 무작위로 정해지고, 이후 나이대마다 선택을 하며 인생이 흘러갑니다.</p>
      <p style="color:var(--muted);font-size:14px;margin-bottom:0">연간 총 ${fmt(COUNTRIES.reduce((s,c)=>s+c[5],0))}명의 출생 · ${COUNTRIES.length}개 국가·지역</p>
    </div>
    ${dailyBox()}
    <button class="btn primary" id="go">무작위로 태어나기</button>
    <p class="note">사건과 선택지는 게임을 위해 단순화한 허구입니다. 국가 통계(출생 수·기대수명·영아사망률·소득 수준)만 실제 데이터에 기반합니다. 출처: World Bank Open Data, CC BY 4.0.</p>`;
  document.getElementById("go").onclick=()=>{G=newLife();renderBirth()};
  const dg=document.getElementById("daily"); if(dg) dg.onclick=()=>{G=newLife(dailySeed());renderBirth()};
}
const dailySeed=()=>Number(todayStr().replace(/-/g,""));
function dailyBox(){
  const prev=store.get("daily"), done=prev&&prev.date===todayStr();
  return `<div class="card"><h2>오늘의 한 명 · ${todayStr()}</h2>
    <p style="margin-top:0">오늘은 누구나 같은 사람으로 태어나요. 같은 출발에서 어떤 선택을 했는지 서로 비교해 보세요.</p>
    ${done?`<p class="res">오늘의 기록: ${prev.text}</p>`:""}
    <button class="btn primary" id="daily">${done?"오늘의 한 명으로 다시 살아 보기":"오늘의 한 명으로 태어나기"}</button></div>`;
}

function renderBirth(){
  const c=G.c, share=pct(c[5],COUNTRIES.reduce((s,x)=>s+x[5],0));
  const tier=["어려운 형편","넉넉하지 않은 형편","중산층 가정","풍족한 가정"][G.famTier];
  app.innerHTML=`
    <h1>당신은 태어났습니다</h1>
    <div class="card">
      <h2>출생지</h2>
      <div class="big">${c[2]}</div>
      <div><span class="tag">${REGIONS[c[3]]}</span><span class="tag">${INCOMES[c[4]]}</span></div>
      <p style="margin-bottom:0;color:var(--soft)">전 세계 신생아 중 약 <b>${share}%</b>가 이곳에서 태어납니다. 이 나라의 기대수명은 <b>${c[6].toFixed(1)}세</b>입니다.</p>
    </div>
    <div class="card">
      <h2>나는 누구</h2>
      <div class="big">${G.sex==="남"?"남자아이":"여자아이"} · ${tier}</div>
      <p style="margin-bottom:0;color:var(--soft)">부모님은 ${G.parent} 일을 합니다.</p>
    </div>
    ${statsHTML()}
    <button class="btn primary" id="next">인생 시작</button>`;
  document.getElementById("next").onclick=()=>{ G.log.push([0,`${c[2]}에서 ${G.sex==="남"?"남자":"여자"}아이로 태어났다`]); startStage(); };
}

let queue=[], cur=null;
function startStage(){
  const st=STAGES[G.stageIdx];
  if(!st||G.lifespan<st.a) return ending();
  // 이 단계의 사건 뽑기
  let pool=EV.filter(e=>e.s===G.stageIdx&&!G.seen.has(e)&&(!e.ok||e.ok(G)));
  const er=G.daily?mulberry(G.seed+G.stageIdx*101):Math.random;
  for(let i=pool.length-1;i>0;i--){const j=Math.floor(er()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]]}
  const n=Math.min(st.evs,pool.length);
  const end=Math.min(st.b,G.lifespan);
  queue=pool.slice(0,n).map((e,i)=>({e,age:Math.min(end,Math.round(st.a+(end-st.a+1)*(i+0.5)/(n||1)))}));
  if(G.stageIdx===0){ // 유아기는 건너뜀
    G.age=Math.min(2,G.lifespan);
    if(G.lifespan<=2) return ending(); else { G.stageIdx++; return startStage(); }
  }
  nextEvent();
}
function nextEvent(){
  if(!queue.length){
    const st=STAGES[G.stageIdx];
    G.age=Math.min(st.b,G.lifespan);
    if(G.lifespan<=st.b) return ending();
    G.stageIdx++; return startStage();
  }
  cur=queue.shift(); G.seen.add(cur.e);
  G.age=Math.min(cur.age,G.lifespan);
  if(G.age>=G.lifespan) return ending();
  const e=cur.e;
  app.innerHTML=`
    <div class="age">${STAGES[G.stageIdx].n} · ${G.age}세 · ${G.c[2]}</div>
    ${statsHTML()}
    <div class="card"><div class="big" style="font-size:18px;font-weight:500">${e.t(G)}</div>
      ${e.ch.map((c,i)=>{
        if(c.req&&!c.req(G)){ G.locked.push({a:G.age,l:c.l,why:c.why}); return `<button class="btn locked" disabled>🔒 ${c.l}<div class="fx">${c.why}</div></button>`; }
        return `<button class="btn" data-i="${i}">${c.l}</button>`; }).join("")}
    </div>`;
  app.querySelectorAll("button[data-i]").forEach(b=>b.onclick=()=>choose(+b.dataset.i));
}
function choose(i){
  const e=cur.e, ch=e.ch[i];
  applyFx(ch.fx);
  let resText=typeof ch.res==="function"?ch.res(G):ch.res, fxs=[ch.fx], died=null;
  if(ch.risk && luck(G,EV.indexOf(e)*7919)<ch.risk.p(G)){
    applyFx(ch.risk.fx); fxs.push(ch.risk.fx);
    resText=ch.risk.res||resText;
    if(ch.risk.die){ G.lifespan=Math.min(G.lifespan,G.age+ (rnd()<0.5?0:1)); G.cause=ch.risk.die; died=true; }
  }
  // 건강이 바닥이면 수명 단축, 아주 좋으면 연장
  if(G.s.h<=10 && G.age>5){ G.lifespan=Math.min(G.lifespan,G.age+Math.floor(rnd()*6)); G.cause=G.cause||"건강 악화로"; }
  const sum=Object.values(ch.fx||{}).reduce((s,v)=>s+Math.abs(v),0)+(died?30:0);
  G.bio.push({a:G.age,l:ch.l,imp:sum});
  G.log.push([G.age,`${e.t(G).replace(/<[^>]+>/g,"")} → ${ch.l}`]);
  const dead = G.age>=G.lifespan;
  app.innerHTML=`
    <div class="age">${STAGES[G.stageIdx].n} · ${G.age}세</div>
    ${statsHTML()}
    <div class="card"><div class="res">${resText}${fxText(ch.fx)}</div>
      <button class="btn primary" id="cont">${dead?"…":"계속"}</button></div>`;
  document.getElementById("cont").onclick=()=> dead?ending():nextEvent();
}

/* ---------- 결말 ---------- */
function ending(){
  const s=G.s, age=Math.min(G.lifespan,110), le=G.c[6];
  const score=(s.h+s.w+s.j+s.r+s.e)/5;
  let title;
  if(age<5) title="너무 짧았던 시작";
  else if(age<18) title="피어나지 못한 어린 생애";
  else if(s.w>=75&&s.j>=60) title="풍요롭고 만족스러운 삶";
  else if(s.r>=75&&s.j>=60) title="사람들에게 사랑받은 삶";
  else if(s.e>=75) title="배움으로 세상을 넓힌 삶";
  else if(s.j>=70) title="소박하지만 행복했던 삶";
  else if(s.w<25&&s.h<35) title="고단했던 한평생";
  else if(score>=60) title="무난히 잘 살아낸 삶";
  else if(score>=45) title="평범한 사람의 하루하루";
  else title="굴곡이 많았던 삶";
  const cause=G.cause||(age>=le?"천수를 누리고":age<le-15?"이른 나이에":"세월이 흘러");
  const diff=age-le;
  const cmp=age<5?"":diff>=0?`${G.c[2]}의 기대수명(${le.toFixed(1)}세)보다 ${Math.round(diff)}년 더 살았습니다.`:`${G.c[2]}의 기대수명(${le.toFixed(1)}세)보다 ${Math.round(-diff)}년 일찍 떠났습니다.`;
  const lines=G.log.map(([a,t])=>`<li><span>${a}세</span>${t}</li>`).join("");
  app.innerHTML=`
    <h1>인생의 끝</h1>
    <div class="card">
      <h2>결말</h2>
      <div class="big">${title}</div>
      <p style="color:var(--soft)">${G.c[2]}에서 태어난 ${G.sex==="남"?"남성":"여성"}이 ${cause} ${age}세에 생을 마쳤습니다. ${cmp}</p>
    </div>
    ${statsHTML()}
    <div class="card"><h2>자서전 카드</h2>
      <canvas id="card" width="1080" height="1350"></canvas>
      <div class="row" style="margin-top:10px"><button class="btn" id="savecard">이미지 저장·공유</button><button class="btn" id="copy">결과 글 복사</button></div></div>
    ${lockedHTML()}
    <div class="card"><h2>걸어온 길</h2><ul class="log">${lines}<li><span>${age}세</span>생을 마쳤다</li></ul></div>
    <button class="btn primary" id="again">다시 태어나기</button>
    <p class="note">같은 버튼으로 80억 명 중 또 다른 한 명이 됩니다.</p>`;
  document.getElementById("again").onclick=()=>renderStart();
  document.getElementById("savecard").onclick=saveCard;
  drawCard(title,age,cause);
  const summary=(G.daily?`[오늘의 한 명 ${G.date}] `:"[랜덤인생게임] ")+`${G.c[2]}에서 태어난 ${G.sex==="남"?"남성":"여성"}, ${age}세, "${title}"`;
  if(G.daily) store.set("daily",{date:G.date,text:summary.replace(/^\[[^\]]*\] /,"")});
  document.getElementById("copy").onclick=async e=>{try{await navigator.clipboard.writeText(summary);e.target.textContent="복사했어요"}catch(_){prompt("복사해서 공유하세요",summary)}};
}

function lockedHTML(){
  if(!G.locked.length) return `<div class="card"><h2>닫혀 있던 문</h2><p style="margin:0">이번 삶에서는 형편 때문에 막힌 선택지가 없었습니다.</p></div>`;
  return `<div class="card"><h2>닫혀 있던 문 ${G.locked.length}개</h2><p style="margin-top:0;color:var(--soft)">같은 나이에 다른 형편이었다면 볼 수 있었던 선택지예요.</p><ul class="log">${G.locked.map(x=>`<li><span>${x.a}세</span>${x.l} <span style="color:var(--muted);font-weight:400">— ${x.why}</span></li>`).join("")}</ul></div>`;
}
function bioLines(title,age,cause){
  const key=G.bio.slice().sort((a,b)=>b.imp-a.imp).slice(0,3).sort((a,b)=>a.a-b.a);
  const tier=["어려운 형편","넉넉하지 않은 집","중산층 가정","풍족한 가정"][G.famTier];
  return [`${G.c[2]}의 ${tier}에서 태어났다.`,...key.map(k=>`${k.a}세, ${k.l}.`),`${age}세, ${cause} 눈을 감았다.`];
}
function wrapText(ctx,text,w){
  const out=[];let line="";
  for(const ch of text){ if(ctx.measureText(line+ch).width>w){out.push(line);line=ch.trim()?ch:""} else line+=ch; }
  if(line) out.push(line); return out;
}
function drawCard(title,age,cause){
  const cv=document.getElementById("card"); if(!cv) return;
  const W=1080,H=1350,ctx=cv.getContext("2d"),FF='"Noto Serif KR","Noto Sans KR","Malgun Gothic",serif';
  ctx.fillStyle="#f5f2ea";ctx.fillRect(0,0,W,H);
  ctx.strokeStyle="#a8742a";ctx.lineWidth=4;ctx.strokeRect(48,48,W-96,H-96);
  ctx.fillStyle="#a8742a";ctx.font=`500 34px ${FF}`;ctx.fillText(G.daily?`오늘의 한 명 · ${G.date}`:"랜덤인생게임",96,140);
  ctx.fillStyle="#1f1d19";ctx.font=`700 68px ${FF}`;
  let y=250; for(const l of wrapText(ctx,title,W-192)){ctx.fillText(l,96,y);y+=88}
  ctx.font=`400 46px ${FF}`;ctx.fillStyle="#3b372f";y+=40;
  for(const ln of bioLines(title,age,cause)){ for(const l of wrapText(ctx,ln,W-192)){ctx.fillText(l,96,y);y+=72} y+=26 }
  ctx.strokeStyle="#ddd6c6";ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(96,H-250);ctx.lineTo(W-96,H-250);ctx.stroke();
  ctx.fillStyle="#8c8578";ctx.font=`400 30px ${FF}`;
  ctx.fillText(`닫혀 있던 선택지 ${G.locked.length}개 · 살아간 해 ${age}년`,96,H-190);
  ctx.fillText("무작위로 태어난 한 사람의 일생",96,H-140);
}
function saveCard(){
  const cv=document.getElementById("card");
  cv.toBlob(async b=>{
    const f=new File([b],"my-life.png",{type:"image/png"});
    try{ if(navigator.canShare&&navigator.canShare({files:[f]})){ await navigator.share({files:[f],title:"나의 한 사람 인생"}); return; } }catch(_){}
    const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="my-life.png";a.click();
  });
}

renderStart();
</script>
</body>
</html>
