<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>산성 수호전</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Silkscreen&family=Song+Myung&display=swap">
<style>
/* Layout: the battlefield canvas leads; the command panel sits beside it on wide screens and below it on narrow ones.
   Palette: 먹(ink) grounds with 단청 accents — 청록 for actions, 주홍 for the wall and danger, 황 for coin. */
:root{
  --ink:#141319; --panel:#1d1c24; --panel-2:#27262f; --panel-3:#312f3a; --line:#3a3845;
  --paper:#ece4d1; --dim:#a39c8c; --faint:#6f6a60; --shade:rgba(8,7,10,.58);
  --jade:#3f9c8a; --jade-hi:#6cc5b1; --jade-dk:#2a6e61;
  --vermilion:#cf5639; --vermilion-dk:#92351f;
  --ochre:#e2aa3c; --mana:#7d97e6; --plum:#b07ad8; --white:#f6f1e6;
  --font-display:"Song Myung","Nanum Myeongjo","AppleMyungjo",serif;
  --font-body:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --font-num:"Silkscreen",ui-monospace,"SFMono-Regular",Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%}
body{margin:0;background:var(--ink);color:var(--paper);font-family:var(--font-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--ochre);outline-offset:2px}

.topbar{position:relative;display:flex;align-items:center;justify-content:space-between;gap:10px 18px;flex-wrap:wrap;padding-inline:16px;padding-block:12px;background:var(--panel)}
.topbar::after{content:"";position:absolute;left:0;right:0;bottom:-6px;height:6px;z-index:1;
  background:repeating-linear-gradient(90deg,var(--jade) 0 22px,var(--white) 22px 24px,var(--ochre) 24px 30px,var(--white) 30px 32px,var(--vermilion) 32px 46px,var(--white) 46px 48px,var(--mana) 48px 58px,var(--white) 58px 60px)}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.seal{flex:none;display:grid;place-items:center;width:40px;height:40px;background:var(--vermilion);color:var(--white);font-family:var(--font-display);font-size:25px;border-radius:3px;box-shadow:inset 0 0 0 2px var(--vermilion-dk);transform:rotate(-4deg)}
.brand h1{margin:0;font-family:var(--font-display);font-weight:400;font-size:26px;letter-spacing:.06em;line-height:1.1;text-wrap:balance}
.brand p{margin:0;color:var(--dim);font-size:12.5px}
.purse{display:flex;align-items:center;gap:8px 18px;flex-wrap:wrap}
.stat{display:flex;align-items:baseline;gap:6px;white-space:nowrap}
.stat .lbl{font-size:12px;color:var(--dim);letter-spacing:.08em}
.num{font-family:var(--font-num);font-weight:400;font-variant-numeric:tabular-nums;letter-spacing:.02em}
.stat b{font-size:17px;color:var(--ochre)}
.stat.pw b{color:var(--jade-hi)}
.icon-btn{background:var(--panel-2);border:1px solid var(--line);border-radius:3px;padding:5px 10px;font-size:13px;color:var(--dim)}
.icon-btn[aria-pressed="true"]{color:var(--paper)}

.layout{display:grid;gap:18px;max-width:1440px;margin:0 auto;padding-inline:16px;padding-block:20px 40px}
.field{min-width:0;display:flex;flex-direction:column;gap:10px}
.canvas-wrap{position:relative;width:100%;aspect-ratio:16/9;background:var(--ink);border:2px solid var(--line);border-radius:4px;overflow:hidden;max-width:100%}
.canvas-wrap canvas{display:block;width:100%;height:100%}
.mode-battle .canvas-wrap{touch-action:none;cursor:crosshair;-webkit-user-select:none;user-select:none}
.mode-battle .field{width:min(100%,calc((100dvh - 210px) * 16 / 9));min-width:min(100%,340px);margin-inline:auto}
.mode-battle .panel{display:none}
.mode-hub .battlebar{display:none}
.field-note{margin:0;color:var(--faint);font-size:12.5px}
.mode-battle .field-note{display:none}
@media (min-width:1080px){
  .mode-hub .layout{grid-template-columns:minmax(0,1.3fr) minmax(400px,1fr);align-items:start}
  .mode-hub .field{position:sticky;top:calc(env(safe-area-inset-top,0px) + 16px)}
}

.battlebar{display:flex;align-items:stretch;justify-content:space-between;gap:10px;flex-wrap:wrap}
.skills{display:flex;gap:8px;flex-wrap:wrap}
.skill{position:relative;overflow:hidden;display:grid;grid-template-columns:auto 1fr;column-gap:10px;align-items:center;min-width:136px;padding:8px 12px;background:var(--panel-2);border:1px solid var(--line);border-bottom-width:3px;border-radius:3px;text-align:left}
.skill .k{grid-row:span 2;display:grid;place-items:center;width:26px;height:26px;background:var(--ink);border:1px solid var(--line);border-radius:2px;font-family:var(--font-num);font-size:12px}
.skill .nm{font-weight:700;font-size:14px;line-height:1.25}
.skill .mp{font-size:12px;color:var(--mana);line-height:1.25}
.skill::after{content:"";position:absolute;left:0;right:0;bottom:0;height:calc(var(--cd,0) * 100%);background:var(--shade);pointer-events:none}
.skill.ready{border-color:var(--jade)}
.skill.nomana .mp{color:var(--vermilion)}
.skill:disabled{opacity:.45;cursor:not-allowed}
.bb-right{display:flex;gap:8px;align-items:stretch}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;font-weight:700;background:var(--panel-2);border:1px solid var(--line);border-bottom-width:3px;border-radius:3px;padding:8px 14px;color:var(--paper);white-space:nowrap}
.btn:hover:not(:disabled){border-color:var(--jade)}
.btn.primary{background:var(--jade);border-color:var(--jade-dk);color:var(--ink)}
.btn.primary:hover:not(:disabled){background:var(--jade-hi);border-color:var(--jade-dk)}
.btn.cta{background:var(--vermilion);border-color:var(--vermilion-dk);color:var(--white)}
.btn.cta:hover:not(:disabled){border-color:var(--ochre)}
.btn:disabled{opacity:.42;cursor:not-allowed}
.btn.wide{width:100%}
.btn .num{font-size:13px}

.panel{min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:4px}
.tabs{display:flex;border-bottom:1px solid var(--line)}
.tabs button{flex:1;background:none;border:0;border-bottom:3px solid transparent;padding:13px 8px 10px;font-family:var(--font-display);font-size:18px;color:var(--dim)}
.tabs button[aria-selected="true"]{color:var(--paper);border-bottom-color:var(--vermilion)}
.tabpane{padding:18px;display:flex;flex-direction:column;gap:18px}
.eyebrow{font-size:12px;letter-spacing:.14em;color:var(--ochre)}
h2{margin:0;font-family:var(--font-display);font-weight:400;font-size:28px;line-height:1.2;text-wrap:balance}
h3{margin:0;font-family:var(--font-display);font-weight:400;font-size:19px;text-wrap:balance}
p{margin:0}
.muted{color:var(--dim);font-size:13px}
.hint{color:var(--faint);font-size:12.5px}

.detail{display:flex;flex-direction:column;gap:12px;padding:16px;background:var(--panel-2);border:1px solid var(--line);border-radius:3px}
.detail-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.facts{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:0;font-size:14px}
.facts div{display:contents}
.facts dt{color:var(--dim)}
.facts dd{margin:0;min-width:0}
.facts .boss{color:var(--plum)}
.gold{color:var(--ochre)}
.tag{display:inline-block;font-size:11.5px;padding:1px 7px;border:1px solid var(--ochre);color:var(--ochre);border-radius:2px;letter-spacing:.04em;vertical-align:1px}
.tag.hot{border-color:var(--vermilion);color:var(--white);background:var(--vermilion)}
.stars i{font-style:normal;color:var(--faint)}
.stars i.on{color:var(--ochre)}
.stars.big{font-size:22px;letter-spacing:2px}

.region{display:flex;flex-direction:column;gap:8px}
.region h3{display:flex;align-items:baseline;gap:8px}
.region h3 span{font-family:var(--font-num);font-size:11px;color:var(--faint)}
.stage-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.stile{display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 2px 7px;background:var(--panel-2);border:1px solid var(--line);border-bottom-width:3px;border-radius:3px}
.stile .no{font-size:17px}
.stile .stars{font-size:11px;letter-spacing:1px;white-space:nowrap}
.stile.boss{border-color:var(--plum)}
.stile.boss .no{color:var(--plum)}
.stile.sel{background:var(--panel-3);border-color:var(--ochre);border-bottom-color:var(--ochre)}
.stile:disabled{opacity:.38;cursor:not-allowed}
.stile:disabled .stars{color:var(--faint);letter-spacing:0}

.subtabs{display:flex;gap:4px;flex-wrap:wrap}
.subtabs button{background:var(--panel-2);border:1px solid var(--line);border-radius:3px;padding:6px 12px;font-size:14px;color:var(--dim)}
.subtabs button.on{background:var(--paper);border-color:var(--paper);color:var(--ink);font-weight:700}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(232px,1fr));gap:10px}
.card{display:flex;flex-direction:column;gap:8px;padding:13px;background:var(--panel-2);border:1px solid var(--line);border-radius:3px;min-width:0}
.card header{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.card h4{margin:0;font-size:16px}
.card .lv{font-size:12px;color:var(--jade-hi);white-space:nowrap}
.card .lv small{color:var(--faint);font-size:10px}
.card .desc{font-size:13px;color:var(--dim);flex:1}
.vals{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 8px;font-size:14px}
.vals .arrow{color:var(--faint)}
.vals .next{color:var(--jade-hi)}
.sec{margin-top:4px}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(232px,1fr));gap:10px}
.slot{display:flex;flex-direction:column;gap:8px;padding:12px;background:var(--panel-2);border:1px solid var(--line);border-radius:3px}
.slot.locked{border-style:dashed}
.slot-h{display:flex;justify-content:space-between;gap:8px;font-size:14px}
.slot-h span{color:var(--dim)}
.pick{display:flex;flex-wrap:wrap;gap:5px}
.chip{background:var(--ink);border:1px solid var(--line);border-radius:2px;padding:4px 9px;font-size:13px;color:var(--dim)}
.chip.on{background:var(--jade);border-color:var(--jade);color:var(--ink);font-weight:700}
.chip:disabled{opacity:.35;cursor:not-allowed}

.field-row{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--dim)}
.field-row input,.submit input{background:var(--ink);border:1px solid var(--line);border-radius:3px;padding:8px 10px;color:var(--paper);font-size:15px;min-width:0}
.board{display:flex;flex-direction:column;gap:10px}
.board-h{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.seg{display:flex;border:1px solid var(--line);border-radius:3px;overflow:hidden}
.seg button{background:var(--panel-2);border:0;padding:5px 12px;font-size:13px;color:var(--dim)}
.seg button.on{background:var(--paper);color:var(--ink);font-weight:700}
.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:3px}
table.rank{width:100%;border-collapse:collapse;font-size:14px}
table.rank th{font-weight:400;font-size:12px;color:var(--dim);text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
table.rank td{padding:8px 10px;border-bottom:1px solid var(--panel-3);white-space:nowrap}
table.rank tr:last-child td{border-bottom:0}
table.rank .r{text-align:right}
table.rank td.rk{color:var(--faint);width:1%}
table.rank tbody tr:nth-child(-n+3) td.rk{color:var(--ochre)}
table.rank tr.me td{background:var(--panel-3)}
table.rank tr.me td:nth-child(2){color:var(--jade-hi)}
table.rank td.empty{color:var(--faint);text-align:center;padding:18px}
table.rank td.nick{max-width:12em;overflow:hidden;text-overflow:ellipsis}
.danger-zone{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding-top:12px;border-top:1px solid var(--line)}
.linkish{background:none;border:0;padding:0;color:var(--faint);font-size:12.5px;text-decoration:underline;text-underline-offset:3px}
.linkish.armed{color:var(--vermilion)}

.modal{position:fixed;inset:0;z-index:20;display:grid;place-items:center;padding:16px;background:var(--shade)}
.modal-card{width:min(440px,100%);max-height:calc(100dvh - 32px);overflow:auto;display:flex;flex-direction:column;gap:14px;padding:22px;background:var(--panel);border:1px solid var(--line);border-top:4px solid var(--vermilion);border-radius:4px}
.modal-card.win{border-top-color:var(--jade)}
.modal-card .stars{font-size:32px;letter-spacing:6px;line-height:1}
.score{font-size:40px;color:var(--ochre);line-height:1}
.score small{font-family:var(--font-body);font-size:16px;color:var(--dim);margin-left:4px}
.notes{margin:0;padding-left:18px;color:var(--jade-hi);font-size:14px}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.actions .btn{flex:1}
.submit{display:flex;gap:8px;flex-wrap:wrap}
.submit input{flex:1 1 140px}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 20px);transform:translateX(-50%);z-index:30;max-width:calc(100% - 32px);padding:10px 16px;background:var(--paper);color:var(--ink);border-radius:3px;font-weight:700;font-size:14px;box-shadow:0 8px 24px var(--shade)}
@media (max-width:520px){
  .brand h1{font-size:22px}
  .tabs button{font-size:16px}
  .skill{min-width:0;flex:1 1 30%;padding:7px 8px;column-gap:6px}
  .skill .k{width:22px;height:22px}
  .bb-right{flex:1 1 100%}
  .bb-right .btn{flex:1}
}
.mini-hud,.rotate-hint{display:none}
@media (max-width:640px){
  .mode-battle .mini-hud{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px;flex:1 1 100%;font-size:12.5px}
  .mh{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:6px;min-width:0}
  .mh-l{color:var(--dim)}
  .mh-track{height:8px;background:var(--panel-3);border-radius:2px;overflow:hidden}
  .mh-track i{display:block;height:100%;width:100%;background:var(--vermilion)}
  .mh-track.mana i{background:var(--mana)}
  .mh b{font-size:11px;color:var(--paper)}
  .mh-info{grid-column:1 / -1;color:var(--ochre);font-size:12.5px}
}
@media (max-width:640px) and (orientation:portrait){ .mode-battle .rotate-hint{display:block;margin:0;color:var(--faint);font-size:12.5px} }
@media (max-height:560px) and (orientation:landscape){
  .mode-battle .topbar{display:none}
  .mode-battle .layout{padding-block:10px}
  .mode-battle .field{flex-direction:row;align-items:flex-start;width:100%}
  .mode-battle .canvas-wrap{flex:none;width:auto;height:min(calc(100dvh - 24px),calc((100vw - 212px) * 9 / 16))}
  .mode-battle .battlebar{flex:1;min-width:0;flex-direction:column;flex-wrap:nowrap;justify-content:flex-start}
  .mode-battle .skills{flex-direction:column;flex-wrap:nowrap}
  .mode-battle .skill{min-width:0;padding:6px 8px;column-gap:6px}
  .mode-battle .bb-right{flex-direction:column}
}
@media (prefers-reduced-motion:reduce){ .seal{transform:none} }
</style>
</head>
<body>
<div id="app" class="mode-hub">
  <header class="topbar">
    <div class="brand">
      <span class="seal" aria-hidden="true">守</span>
      <div><h1>산성 수호전</h1><p>성곽을 키워 고을을 지키는 고전 성지키기</p></div>
    </div>
    <div class="purse">
      <div class="stat"><span class="lbl">엽전</span><b class="num" id="goldTxt">0</b><span class="muted">냥</span></div>
      <div class="stat pw"><span class="lbl">전투력</span><b class="num" id="powerTxt">0</b></div>
      <button class="icon-btn" id="soundBtn" data-act="sound" aria-pressed="true">소리 켬</button>
    </div>
  </header>

  <main class="layout">
    <section class="field" aria-label="전장">
      <div class="canvas-wrap" id="canvasWrap">
        <canvas id="cv" aria-label="산성 전장. 누르고 있으면 장수가 그 지점으로 활을 쏩니다."></canvas>
      </div>
      <div class="battlebar" id="battleBar">
        <div class="mini-hud" aria-hidden="true">
          <div class="mh"><span class="mh-l">성벽</span><div class="mh-track"><i id="mhWall"></i></div><b class="num" id="mhWallT"></b></div>
          <div class="mh"><span class="mh-l">기력</span><div class="mh-track mana"><i id="mhMana"></i></div><b class="num" id="mhManaT"></b></div>
          <div class="mh-info" id="mhInfo"></div>
        </div>
        <div class="skills" id="skillBtns"></div>
        <div class="bb-right">
          <button class="btn" data-act="speed" id="speedBtn">배속 1×</button>
          <button class="btn" data-act="pause" id="pauseBtn">잠시 멈춤</button>
        </div>
      </div>
      <p class="field-note">육성 탭에서 올린 방어탑과 장수가 이 성곽에 그대로 나타납니다.</p>
      <p class="rotate-hint">휴대폰을 가로로 돌리면 전장이 더 크게 보입니다.</p>
    </section>

    <section class="panel" id="hubPanel">
      <nav class="tabs" role="tablist" aria-label="성 관리">
        <button role="tab" id="t-stages" aria-controls="tab-stages" aria-selected="true" data-act="tab" data-id="stages">출정</button>
        <button role="tab" id="t-upgrades" aria-controls="tab-upgrades" aria-selected="false" data-act="tab" data-id="upgrades">육성</button>
        <button role="tab" id="t-ranked" aria-controls="tab-ranked" aria-selected="false" data-act="tab" data-id="ranked">랭킹전</button>
      </nav>
      <div class="tabpane" id="tab-stages" role="tabpanel" aria-labelledby="t-stages"></div>
      <div class="tabpane" id="tab-upgrades" role="tabpanel" aria-labelledby="t-upgrades" hidden></div>
      <div class="tabpane" id="tab-ranked" role="tabpanel" aria-labelledby="t-ranked" hidden></div>
    </section>
  </main>

  <div class="modal" id="modal" hidden><div class="modal-card" id="modalCard" role="dialog" aria-modal="true"></div></div>
  <div class="toast" id="toast" role="status" hidden></div>
</div>
<noscript>이 게임은 자바스크립트가 필요합니다.</noscript>

<script>
(() => {
'use strict';

// ───────────────────────── constants & helpers ─────────────────────────
const W = 960, H = 540, GROUND = 440, WALL_FRONT = 226, KEEP_R = 114, TERRACE_Y = 232, WALK_Y = 292;
const TAU = Math.PI * 2, G = 900, STAGE_COUNT = 20;
const OUT = '#15131a';
const FONT_UI = '"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",sans-serif';
const FONT_DISP = '"Song Myung","Nanum Myeongjo",serif';
const FONT_NUM = '"Silkscreen",ui-monospace,monospace';
const $ = (s, r = document) => r.querySelector(s);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const rand = (a, b) => a + Math.random() * (b - a);
const pick = a => a[(Math.random() * a.length) | 0];
const fmt = n => Math.floor(Math.max(0, n)).toLocaleString('ko-KR');
const fmtShort = n => {
  n = Math.max(0, n);
  if (n >= 1e8) return (n / 1e8).toFixed(n >= 1e9 ? 0 : 1).replace(/\.0$/, '') + '억';
  if (n >= 1e4) return (n / 1e4).toFixed(n >= 1e5 ? 0 : 1).replace(/\.0$/, '') + '만';
  return Math.round(n).toLocaleString('ko-KR');
};
const pct = v => (Math.round(v * 1000) / 10) + '%';
const reduceMotion = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
function rgba(hex, a) { const n = parseInt(hex.slice(1), 16); return `rgba(${n >> 16 & 255},${n >> 8 & 255},${n & 255},${a})`; }
function mulberry(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const josa = (w, a, b) => { const c = w.charCodeAt(w.length - 1) - 0xAC00; return w + (c >= 0 && c < 11172 && c % 28 ? a : b); };

// ───────────────────────── game data ─────────────────────────
const REGIONS = [

function stagePool(s) {

  if (s >= 7) p.push(['archer', 2.5]);

}

}

if (window.ResizeObserver) new ResizeObserver(resize).observe(wrap); else window.addEventListener('resize', resize);

// ───────────────────────── battle state ─────────────────────────
let B = null, paused = false, speed = 1, eid = 0, lastStage = 1, lastRec = null;

function baseBattle(mode) {
  const st = stats();

    mode, st, t: 0, phase: 'break', breakT: 2.4, wave: 0, queue: [], spawnT: 0,
    enemies: [], shots: [], fx: [], texts: [],
    wall: { hp: st.wallMax, max: st.wallMax }, mana: st.manaMax * st.startMana, skillCd: {},
    gold: 0, kills: 0, score: 0, heroCd: 0, heroDraw: 0, heroAng: -0.2,
    aim: { x: 640, y: 400, down: false, over: false, key: false, queued: false },
    tCd: [0.4, 0.6, 0.8, 1.0], tAim: [-0.25, -0.25, -0.25, -0.25], tRec: [0, 0, 0, 0],
    state: 'run', shake: 0, flashT: 0, frostT: 0, banner: null,
    hpMul: 1, dmgMul: 1, goldMul: 1, spdMul: 1, scoreMul: 1, region: 0, stage: 0, waves: null,

}
function startStage(s) {

  B = baseBattle('stage'); B.stage = s; B.region = Math.floor((s - 1) / 5); B.waves = buildStage(s);

  enterBattle();

}
function startRank() {
  if (save.cleared < 3) return;
  B = baseBattle('rank'); enterBattle(); banner('랭킹전', '끝없이 밀려드는 침공을 막아 내십시오');
}
function banner(text, sub) { if (B) B.banner = { text, sub, t: 0, life: 2.4 }; }

function startWave() {
  const b = B; b.wave++; b.phase = 'wave'; b.spawnT = 0.3;
  if (b.mode === 'stage') b.queue = b.waves[b.wave - 1].slice();
  else {
    const n = b.wave, m = stageMul(rankLevel(n));
    Object.assign(b, { hpMul: m.hp, dmgMul: m.dmg, goldMul: m.gold * 0.5, spdMul: Math.min(1.35, m.spd), scoreMul: 1 + n * 0.1, region: Math.floor((n - 1) / 10) % 4 });
    b.queue = buildRankWave(n);
  }
  const last = b.mode === 'stage' && b.wave === b.waves.length;
  banner(`제 ${b.wave} 파`, b.mode === 'rank' ? `점수 배율 ×${b.scoreMul.toFixed(1)}` : last ? '마지막 공세' : `모두 ${b.waves.length}파`);
  Sfx.play('wave');
}
function waveCleared() {
  const b = B;
  if (b.mode === 'stage' && b.wave >= b.waves.length) return win();
  if (b.mode === 'rank') { const bonus = 50 * b.wave; b.score += bonus; addText(W / 2, 128, `제 ${b.wave}파 격퇴  +${fmt(bonus)}점`, '#e2aa3c', 17); }
  b.phase = 'break'; b.breakT = b.mode === 'rank' ? 3 : 3.5;
}

function spawn(type, atX) {
  const d = ENEMY[type], b = B;
  const e = {
    id: ++eid, type, hp: d.hp * b.hpMul, max: 0, spd: d.spd * b.spdMul * rand(0.92, 1.08), dmg: d.dmg * b.dmgMul, cd: d.cd, atkT: d.cd * 0.4,
    armor: d.armor || 0, w: d.w, h: d.h, fly: !!d.fly, ranged: !!d.ranged, boss: !!d.boss, gold: d.gold, score: d.score,
    x: atX != null ? atX : W + 24 + rand(0, 30), y: 0, baseY: 0, ph: rand(0, 6), flash: 0, atk: 0, slowT: 0, slowF: 0, frozen: 0, sumT: 6, charged: false,
  };
  e.max = e.hp;
  if (e.fly) { e.baseY = rand(195, 330); e.y = e.baseY; e.stopX = WALL_FRONT + 24 + rand(0, 46); }
  else { e.y = GROUND + (e.boss ? 8 : rand(-2, 14)); e.stopX = e.ranged ? rand(400, 520) : WALL_FRONT + (d.front || d.w / 2) + rand(0, 14); }
  if (e.boss) { banner('두령 출현', d.name); b.shake = 6; Sfx.play('wave'); }
  b.enemies.push(e);
  return e;
}
const ecy = e => (e.fly ? e.y : e.y - e.h / 2);
const etop = e => (e.fly ? e.y - e.h / 2 : e.y - e.h);

function addText(x, y, txt, c, size = 13, font = FONT_UI) { const T = B.texts; if (T.length > 70) T.shift(); T.push({ x, y, txt, c, size, font, t: 0, life: 0.9 }); }
function addNum(x, y, dmg, crit) { addText(x, y, fmtShort(dmg), crit ? '#ffd05a' : '#ffffff', crit ? 17 : 12, FONT_NUM); }
function pushFx(f) { const F = B.fx; if (F.length > 420) F.splice(0, 40); F.push(f); }
function burst(x, y, c, n, spd = 120) { for (let i = 0; i < n; i++) pushFx({ k: 'p', x, y, vx: rand(-spd, spd), vy: rand(-spd * 1.6, -spd * 0.2), g: 480, t: 0, life: rand(0.3, 0.6), c, r: rand(1.5, 3.2) }); }

function hurt(e, dmg, kind, crit, show) {
  if (e.hp <= 0) return;
  if (kind === 'phys' && e.armor) dmg *= 1 - e.armor;
  e.hp -= dmg; e.flash = 0.09;
  if (show || crit || (kind !== 'phys' && dmg > e.max * 0.08)) addNum(e.x + rand(-6, 6), etop(e) - 6, dmg, crit);
  if (e.hp <= 0) kill(e);
}
function kill(e) {
  const b = B, g = Math.max(1, Math.round(e.gold * b.goldMul * (1 + b.st.goldBonus)));
  b.gold += g; b.kills++; b.score += Math.round(e.score * b.scoreMul);
  addText(e.x, etop(e) - 16, `+${fmt(g)}냥`, '#e8b44a', 12);
  pushFx({ k: 'die', e: { type: e.type, x: e.x, y: e.y, w: e.w, h: e.h, fly: e.fly, ph: e.ph, id: e.id, atk: 0, flash: 0 }, t: 0, life: e.boss ? 1.1 : 0.5 });
  burst(e.x, ecy(e), e.fly ? '#2b2833' : '#c9bfa8', e.boss ? 18 : 5);
  if (e.boss) { b.shake = 10; pushFx({ k: 'boom', x: e.x, y: ecy(e), r: 90, t: 0, life: 0.6, c: '#f7c55a' }); banner('두령 토벌', ENEMY[e.type].name); Sfx.play('boom'); }
  Sfx.play('coin', 70);
}
function hitWall(dmg, e) {
  const b = B; if (b.state !== 'run') return;
  const d = dmg * (1 - b.st.wallArmor); b.wall.hp -= d;
  b.shake = Math.min(9, b.shake + (e && e.boss ? 5 : 0.7));
  const y = e ? ecy(e) : rand(310, 420);
  for (let i = 0; i < 3; i++) pushFx({ k: 'p', x: WALL_FRONT + rand(-2, 6), y: y + rand(-8, 8), vx: rand(20, 90), vy: rand(-120, -20), g: 400, t: 0, life: 0.5, c: '#9b9284', r: rand(1.5, 3) });
  if (d >= b.wall.max * 0.01) addText(WALL_FRONT - 12, y - 10, '-' + fmtShort(d), '#ff8c6e', 12, FONT_NUM);
  Sfx.play('wall', 90);
  if (b.wall.hp <= 0) { b.wall.hp = 0; lose(); }
}
function explode(x, y, r, dmg, kind, air, color, big) {
  for (const e of B.enemies) {
    if (e.hp <= 0 || (!air && e.fly)) continue;
    const nx = clamp(x, e.x - e.w / 2, e.x + e.w / 2), ny = clamp(y, etop(e), e.fly ? e.y + e.h / 2 : e.y);
    if (Math.hypot(nx - x, ny - y) <= r) hurt(e, dmg, kind);
  }
  pushFx({ k: 'boom', x, y, r, t: 0, life: big ? 0.45 : 0.3, c: color });
  burst(x, y, color, big ? 9 : 4, big ? 140 : 90);
}
function hitTest(x, y) {
  for (const e of B.enemies) {
    if (e.hp <= 0) continue;
    const hw = e.w / 2 + 3; if (x < e.x - hw || x > e.x + hw) continue;
    if (y >= etop(e) - 3 && y <= (e.fly ? e.y + e.h / 2 + 3 : e.y + 3)) return e;
  }
  return null;
}
function findTarget(ox, range, air) {
  let best = null;
  for (const e of B.enemies) { if (e.hp <= 0 || (!air && e.fly) || e.x > W - 6 || e.x - ox > range) continue; if (!best || e.x < best.x) best = e; }
  return best;
}
function ballistic(x0, y0, x1, y1, g, spd) { const dx = x1 - x0, dy = y1 - y0, t = clamp(Math.hypot(dx, dy) / spd, 0.18, 1.1); return { vx: dx / t, vy: dy / t - 0.5 * g * t }; }

  const out = [];
  for (let i = 0; i < pts.length - 1; i++) {
    const [x0, y0] = pts[i], [x1, y1] = pts[i + 1], n = Math.max(2, Math.round(Math.hypot(x1 - x0, y1 - y0) / 22));
    for (let k = 0; k < n; k++) { const p = k / n, j = k === 0 ? 0 : 9; out.push([x0 + (x1 - x0) * p + rand(-j, j), y0 + (y1 - y0) * p + rand(-j, j)]); }
  }
  out.push(pts[pts.length - 1]); return out;
}

function heroShoot() {
  const b = B, st = b.st, n = st.heroN, ox = HERO.x + 6, oy = HERO.y - 30;
  for (let i = 0; i < n; i++) {
    const off = (i - (n - 1) / 2) * 26;
    const tx = Math.max(WALL_FRONT + 10, b.aim.x + off), ty = Math.min(GROUND + 4, b.aim.y + Math.abs(off) * 0.15);
    const v = ballistic(ox, oy, tx, ty, G, 820), crit = Math.random() < st.crit;
    b.shots.push({ k: 'arrow', x: ox, y: oy, vx: v.vx, vy: v.vy, a: Math.atan2(v.vy, v.vx), dmg: st.heroDmg * (crit ? 2.5 : 1), crit });
  }
  b.heroDraw = 1; Sfx.play('bow', 60);
}
function towerFire(i) {
  const b = B, type = save.slots[i], T = TOWERS[type], l = save.tw[type], s = SLOTS[i];
  const ox = s.x + 4, oy = s.y - 28, tg = findTarget(ox, T.range, T.air);
  if (!tg) return false;
  const dmg = T.dmg(l);
  b.tAim[i] = Math.atan2(ecy(tg) - oy, tg.x - ox) - 0.22; b.tRec[i] = 1;
  if (type === 'archer') {
    const d0 = Math.hypot(tg.x - ox, ecy(tg) - oy);
    b.shots.push({ k: 'tarrow', x: ox, y: oy, tg, tx: tg.x, ty: ecy(tg), spd: 780, dmg, lift: Math.min(60, d0 * 0.12), d0, trav: 0, a: 0 });
    Sfx.play('bow', 110);
  } else if (type === 'hwacha') {
    const cands = b.enemies.filter(e => e.hp > 0 && e.x - ox <= T.range && e.x < W - 6).sort((p, q) => p.x - q.x).slice(0, 6);
    for (let k = 0; k < T.shots; k++) { const t = cands[k % cands.length]; b.shots.push({ k: 'rocket', x: ox, y: oy, vx: rand(260, 380), vy: rand(-420, -260), tg: t, tx: t.x, ty: ecy(t), dmg, splash: T.splash, delay: k * 0.07, age: 0, a: -0.6 }); }
    Sfx.play('fire', 250);
  } else if (type === 'cannon') {
    const tt = 0.9, moving = tg.x > tg.stopX && tg.frozen <= 0;
    const lead = moving ? tg.spd * (tg.slowT > 0 ? 1 - tg.slowF : 1) * tt : 0, ax = Math.max(tg.stopX, tg.x - lead);
    b.shots.push({ k: 'ball', x: ox + 14, y: oy, vx: (ax - ox - 14) / tt, vy: (GROUND - 4 - oy) / tt - 0.5 * 700 * tt, g: 700, dmg, splash: T.splash });
    pushFx({ k: 'smoke', x: ox + 18, y: oy - 2, t: 0, life: 0.6 });
    Sfx.play('boom', 150);
  } else {
    const hit = [tg]; let cur = tg;
    while (hit.length < T.chain(l)) {
      let best = null, bd = 150;
      for (const e of b.enemies) { if (e.hp <= 0 || hit.includes(e)) continue; const d = Math.hypot(e.x - cur.x, ecy(e) - ecy(cur)); if (d < bd) { bd = d; best = e; } }
      if (!best) break; hit.push(best); cur = best;
    }
    pushFx({ k: 'bolt', pts: jag([[ox + 8, oy - 12], ...hit.map(e => [e.x, ecy(e)])]), t: 0, life: 0.22, c: '#9fc4ff', w: 2.4 });
    for (const e of hit) { hurt(e, dmg, 'magic'); if (e.hp > 0) { e.slowT = 1.6; e.slowF = Math.max(e.slowF, T.slow); } }
    Sfx.play('zap', 120);
  }
  return true;
}
function enemyShoot(e) {
  const ox = e.x - 10, oy = e.y - 30, v = ballistic(ox, oy, WALL_FRONT - 2, rand(305, 420), G, 620);
  B.shots.push({ k: 'earrow', x: ox, y: oy, vx: v.vx, vy: v.vy, dmg: e.dmg, a: Math.PI });
}

function castSkill(id) {
  const b = B; if (!b || b.state !== 'run' || paused) return;
  const sk = SKILL[id]; if (!skillOpen(sk)) return;
  if ((b.skillCd[id] || 0) > 0 || b.mana < sk.mana) { Sfx.play('deny', 200); return; }
  const lv = L(sk.upg), alive = b.enemies.filter(e => e.hp > 0);
  if (!alive.length) { Sfx.play('deny', 200); return; }
  b.mana -= sk.mana; b.skillCd[id] = sk.cd;
  if (id === 'fire') {
    const ground = alive.filter(e => !e.fly), dmg = sk.dmg(lv);
    for (let i = 0, n = sk.count(lv); i < n; i++) {
      const tgt = ground.length && Math.random() < 0.65 ? pick(ground) : null;
      const x = tgt ? tgt.x + rand(-24, 24) : rand(WALL_FRONT + 40, W - 20), y0 = -rand(20, 560), T = (GROUND - 6 - y0) / 760;
      b.shots.push({ k: 'fire', x: x + 110 * T, y: y0, vx: -110, vy: 760, dmg });
    }
    Sfx.play('fire');
  } else if (id === 'thunder') {
    const dmg = sk.dmg(lv), tg = alive.sort((p, q) => q.hp - p.hp).slice(0, sk.count(lv));
    for (const e of tg) { pushFx({ k: 'bolt', pts: jag([[e.x + rand(-40, 40), -10], [e.x, ecy(e)]]), t: 0, life: 0.35, c: '#fff1a8', w: 4 }); pushFx({ k: 'boom', x: e.x, y: ecy(e), r: 30, t: 0, life: 0.3, c: '#fff1a8' }); hurt(e, dmg, 'magic', false, true); }
    b.flashT = 0.16; b.shake = Math.max(b.shake, 5); Sfx.play('thunder');
  } else {
    const dur = sk.dur(lv);
    for (const e of alive) e.frozen = Math.max(e.frozen, e.boss ? dur * 0.5 : dur);
    b.frostT = dur; Sfx.play('freeze');
  }
}

function updateEnemy(e, dt) {
  if (e.hp <= 0) return;
  e.flash -= dt; e.atk = Math.max(0, e.atk - dt * 3);
  if (e.frozen > 0) { e.frozen -= dt; return; }
  let sp = e.spd;
  if (e.slowT > 0) { e.slowT -= dt; sp *= 1 - e.slowF; if (e.slowT <= 0) e.slowF = 0; }
  if (e.boss) {
    e.sumT -= dt;
    if (e.sumT <= 0) { e.sumT = 8; if (B.enemies.length < 60) { for (let k = 0; k < 3; k++) spawn(ENEMY[e.type].summon, Math.min(W + 20, e.x + 34 + k * 18)); pushFx({ k: 'ring', x: e.x, y: ecy(e), r: 70, t: 0, life: 0.5, c: '#c48bff' }); } }
  }
  if (e.fly) e.y = e.baseY + Math.sin(B.t * 2.2 + e.id) * 8;
  if (e.x > e.stopX) { e.x = Math.max(e.stopX, e.x - sp * dt); e.ph += dt * sp * 0.16; e.atkT = e.cd * 0.4; }
  else {
    e.atkT -= dt; e.ph += dt * 1.5;
    if (e.atkT <= 0) {
      e.atkT = e.cd; e.atk = 1;
      if (e.ranged) enemyShoot(e);
      else { let d = e.dmg; if (e.type === 'boar' && !e.charged) { d *= 2; e.charged = true; } hitWall(d, e); }
    }
  }
}

function stepShot(s, dt) {
  const b = B;
  switch (s.k) {
    case 'arrow': {
      const sub = Math.max(1, Math.ceil(Math.hypot(s.vx, s.vy) * dt / 10)), h = dt / sub;
      for (let i = 0; i < sub; i++) {
        s.vy += G * h; s.x += s.vx * h; s.y += s.vy * h;
        const e = hitTest(s.x, s.y);
        if (e) { hurt(e, s.dmg, 'phys', s.crit, true); burst(s.x, s.y, '#f1e3c0', 3, 70); Sfx.play('hit', 50); return false; }
        if (s.y >= GROUND + 8) { pushFx({ k: 'stuck', x: s.x, y: GROUND + 8, a: Math.atan2(s.vy, s.vx), t: 0, life: 1.4 }); return false; }
      }
      s.a = Math.atan2(s.vy, s.vx);
      return s.x < W + 60 && s.x > -60;
    }
    case 'tarrow': {
      const tg = s.tg; if (tg && tg.hp > 0) { s.tx = tg.x; s.ty = ecy(tg); }
      const dx = s.tx - s.x, dy = s.ty - s.y, d = Math.hypot(dx, dy), step = s.spd * dt;
      if (d <= step + 3) { if (tg && tg.hp > 0) hurt(tg, s.dmg, 'phys'); return false; }
      s.x += dx / d * step; s.y += dy / d * step; s.trav += step; s.a = Math.atan2(dy, dx);
      return true;
    }
    case 'rocket': {
      if (s.delay > 0) { s.delay -= dt; return true; }
      s.age += dt;
      const tg = s.tg; if (tg && tg.hp > 0) { s.tx = tg.x; s.ty = ecy(tg); }
      const dx = s.tx - s.x, dy = s.ty - s.y, d = Math.hypot(dx, dy);
      let a = Math.atan2(s.vy, s.vx), diff = Math.atan2(dy, dx) - a;
      while (diff > Math.PI) diff -= TAU; while (diff < -Math.PI) diff += TAU;
      const turn = (3 + s.age * 16) * dt; a += clamp(diff, -turn, turn);
      const sp = Math.min(950, Math.hypot(s.vx, s.vy) + 700 * dt);
      s.vx = Math.cos(a) * sp; s.vy = Math.sin(a) * sp; s.x += s.vx * dt; s.y += s.vy * dt; s.a = a;
      if (Math.random() < 0.5) pushFx({ k: 'p', x: s.x, y: s.y, vx: rand(-20, 20), vy: rand(-20, 20), g: 0, t: 0, life: 0.28, c: '#f0b04a', r: 2 });
      if (d < 12 || s.y >= GROUND - 2 || s.age > 2.6) { explode(s.x, Math.min(s.y, GROUND - 4), s.splash, s.dmg, 'phys', true, '#f3a13b'); return false; }
      return true;
    }
    case 'ball': {
      s.vy += s.g * dt; s.x += s.vx * dt; s.y += s.vy * dt;
      if (s.y >= GROUND - 4) { explode(s.x, GROUND - 6, s.splash, s.dmg, 'blast', false, '#f7c55a', true); b.shake = Math.min(6, b.shake + 1.4); Sfx.play('boom', 80); return false; }
      return true;
    }
    case 'fire': {
      s.x += s.vx * dt; s.y += s.vy * dt;
      if (s.y >= GROUND - 6) { explode(s.x, GROUND - 8, 46, s.dmg, 'blast', false, '#ff7a3a'); return false; }
      return true;
    }
    case 'earrow': {
      s.vy += G * dt; s.x += s.vx * dt; s.y += s.vy * dt; s.a = Math.atan2(s.vy, s.vx);
      if (s.x <= WALL_FRONT - 2) { hitWall(s.dmg, null); return false; }
      return s.y < H;
    }
  }
  return false;
}

function update(dt) {
  const b = B; if (!b || b.state !== 'run') return;
  b.t += dt;
  if (b.phase === 'break') { b.breakT -= dt; if (b.breakT <= 0) startWave(); }
  else if (b.queue.length) { b.spawnT -= dt; while (b.queue.length && b.spawnT <= 0) { const it = b.queue.shift(); spawn(it.t); b.spawnT += it.gap; } }
  else if (!b.enemies.length) { waveCleared(); if (b.state !== 'run') return; }

  b.wall.hp = Math.min(b.wall.max, b.wall.hp + b.st.wallRegen * b.wall.max * dt);
  b.mana = Math.min(b.st.manaMax, b.mana + b.st.manaRegen * dt);
  for (const k in b.skillCd) if (b.skillCd[k] > 0) b.skillCd[k] -= dt;

  b.heroCd -= dt; b.heroDraw = Math.max(0, b.heroDraw - dt * 4);
  b.heroAng = Math.atan2(b.aim.y - (HERO.y - 28), b.aim.x - HERO.x) - clamp((b.aim.x - HERO.x) / 2600, 0, 0.35);
  if ((b.aim.down || b.aim.key || b.aim.queued) && b.heroCd <= 0) { heroShoot(); b.heroCd = b.st.heroCd; b.aim.queued = false; }

  for (let i = 0; i < SLOTS.length; i++) {
    b.tRec[i] = Math.max(0, b.tRec[i] - dt * 4);
    const t = save.slots[i]; if (i >= save.slotOpen || !t) continue;
    b.tCd[i] -= dt; if (b.tCd[i] <= 0) b.tCd[i] = towerFire(i) ? TOWERS[t].cd : 0.15;
  }

    b.innerHTML = `<span class="k">${sk.key}</span><span class="nm">${sk.name}</span><span class="mp">${open ? `기력 ${sk.mana}` : `제 ${sk.req} 관문 후`}</span>`;
    box.append(b);
  }
}
function syncBattleBar() {
  for (const el of $('#skillBtns').children) {
    const sk = SKILL[el.dataset.id]; if (!skillOpen(sk)) continue;
    const cd = Math.max(0, B.skillCd[sk.id] || 0), frac = cd / sk.cd, ready = cd <= 0 && B.mana >= sk.mana;
    const key = Math.round(frac * 40) + ':' + ready + ':' + (B.mana >= sk.mana);
    if (el._k !== key) { el._k = key; el.style.setProperty('--cd', frac.toFixed(3)); el.classList.toggle('ready', ready); el.classList.toggle('nomana', B.mana < sk.mana); }
  }
  syncMiniHud();
}
let miniT = 0;
function syncMiniHud() {
  const now = performance.now(); if (now - miniT < 120) return; miniT = now;
  const b = B; $('#mhWall').style.width = (clamp(b.wall.hp / b.wall.max, 0, 1) * 100).toFixed(1) + '%'; $('#mhWallT').textContent = fmtShort(b.wall.hp);
  $('#mhMana').style.width = (clamp(b.mana / b.st.manaMax, 0, 1) * 100).toFixed(1) + '%'; $('#mhManaT').textContent = Math.floor(b.mana);
  $('#mhInfo').textContent = (b.mode === 'stage' ? `제 ${b.stage} 관문 · ${b.wave} / ${b.waves.length} 파` : `랭킹전 제 ${Math.max(1, b.wave)} 파 · ${fmt(b.score)}점`) + ` · 전리품 ${fmt(b.gold)}냥`;
}
function syncSpeed() { $('#speedBtn').textContent = `배속 ${speed}×`; }
function toggleSpeed() { speed = speed === 1 ? 2 : 1; syncSpeed(); }
function togglePause(v) {
  if (!B || B.state !== 'run') return;
  paused = v === undefined ? !paused : v;
  if (paused) { B.aim.down = false; B.aim.key = false; openModal(`<div class="eyebrow">${B.mode === 'rank' ? '랭킹전' : `제 ${B.stage} 관문`}</div><h2>잠시 멈춤</h2><p class="muted">항복하면 지금까지 거둔 전리품 ${fmt(B.gold)}냥은 챙겨 성으로 돌아갑니다.</p><div class="actions"><button class="btn" data-act="surrender">항복</button><button class="btn primary" data-act="resume" data-focus>계속 싸우기</button></div>`); }
  else closeModal();
}
function enterBattle() {
  paused = false; closeModal(); app.classList.remove('mode-hub'); app.classList.add('mode-battle');
  buildSkillBar(); syncSpeed(); Sfx.ensure();
  requestAnimationFrame(() => { resize(); wrap.scrollIntoView({ block: 'nearest' }); });
}
function exitBattle() {
  B = null; paused = false; closeModal(); app.classList.remove('mode-battle'); app.classList.add('mode-hub');
  if (Cloud.pending && Cloud.pending.savedAt > save.savedAt) Cloud.adopt(Cloud.pending);
  Cloud.pending = null;
  renderAll(); requestAnimationFrame(resize);
}

function showWin(r) {
  const next = r.s < STAGE_COUNT;
  openModal(`<div class="eyebrow">제 ${r.s} 관문 돌파</div><h2>${r.s === STAGE_COUNT && r.first ? '고을을 끝까지 지켜 냈습니다' : '성을 지켜 냈습니다'}</h2>
    <div class="stars" aria-label="별 ${r.stars}개">${starHtml(r.stars)}</div>
    <dl class="facts"><div><dt>처치</dt><dd class="num">${fmt(r.kills)}</dd></div><div><dt>전리품</dt><dd><span class="num">${fmt(r.loot)}</span>냥</dd></div>
    <div><dt>돌파 보상</dt><dd><span class="num">${fmt(r.bonus)}</span>냥 ${r.first ? '<span class="tag">첫 돌파 2배</span>' : ''}</dd></div>
    <div><dt>합계</dt><dd><b class="num gold">${fmt(r.loot + r.bonus)}</b>냥</dd></div></dl>
    ${r.notes.length ? `<ul class="notes">${r.notes.map(n => `<li>${n}</li>`).join('')}</ul>` : ''}
    <div class="actions"><button class="btn" data-act="hubUp">육성하러 가기</button><button class="btn" data-act="retry">다시 하기</button>${next ? `<button class="btn primary" data-act="next" data-focus>다음 관문</button>` : ''}</div>`, 'win');
}
function showLose(r) {
  openModal(`<div class="eyebrow">제 ${r.s} 관문 · ${r.wave} / ${r.total} 파</div><h2>성벽이 무너졌습니다</h2>
    <p>거둔 전리품 <b class="num gold">${fmt(r.loot)}</b>냥은 챙겨 왔습니다. 처치 ${fmt(r.kills)}.</p>
    <p class="muted">육성 탭에서 성벽을 증축하거나 방어탑을 강화한 뒤 다시 도전해 보세요. 앞 관문을 다시 돌아도 엽전이 모입니다.</p>
    <div class="actions"><button class="btn primary" data-act="hubUp" data-focus>육성하러 가기</button><button class="btn" data-act="retry">다시 도전</button></div>`);
}
function showRankOver(rec, isBest, loot) {
  const canOnline = !!Cloud.db;
  openModal(`<div class="eyebrow">랭킹전 종료 · 제 ${rec.wave}파</div><h2>성벽이 무너졌습니다</h2>
    <div class="score num">${fmt(rec.score)}<small>점</small></div>
    ${isBest ? '<p><span class="tag hot">내 최고 기록</span></p>' : ''}
    <dl class="facts"><div><dt>처치</dt><dd class="num">${fmt(rec.kills)}</dd></div><div><dt>전리품</dt><dd><span class="num">${fmt(loot)}</span>냥</dd></div><div><dt>전투력</dt><dd class="num">${fmt(rec.power)}</dd></div></dl>
    ${canOnline ? `<div class="submit"><input id="nickModal" maxlength="12" placeholder="닉네임" aria-label="닉네임" autocomplete="off"><button class="btn primary" data-act="submit">온라인 랭킹 등록</button></div>` : ''}
    <p class="muted" id="submitNote">${canOnline ? '이 기기 기록에는 자동으로 남겼습니다. 온라인에는 한 사람당 최고 기록 하나만 올라갑니다.' : '이 기기 랭킹에 기록했습니다.'}</p>
    <div class="actions"><button class="btn" data-act="hubRank">명예의 전당</button><button class="btn cta" data-act="rank" data-focus>다시 출전</button></div>`);
  const ni = $('#nickModal'); if (ni) ni.value = save.nick;
}
async function submitRank() {
  const ni = $('#nickModal'), note = $('#submitNote'), btn = modalCard.querySelector('[data-act="submit"]');
  const nick = cleanNick(ni ? ni.value : save.nick);
  if (!nick) { note.textContent = '랭킹에 올릴 닉네임을 적어 주세요.'; ni && ni.focus(); return; }
  save.nick = nick; if (lastRec) lastRec.nick = nick; persist();
  btn.disabled = true; note.textContent = '등록하는 중입니다…';
  const res = await Cloud.submit(Object.assign({}, lastRec, { nick }));
  if (res.ok) { note.textContent = res.kept ? `이미 더 높은 기록(${fmt(res.prev)}점)이 올라가 있어 그 기록을 유지합니다.` : '온라인 랭킹에 올렸습니다.'; boardView = 'online'; }
  else { note.textContent = res.reason === 'denied' ? '이 화면에서는 기록을 올릴 권한이 없습니다. 아티팩트 소유자에게 참여자 권한을 요청하세요.' : '등록하지 못했습니다. 잠시 뒤 다시 눌러 주세요.'; btn.disabled = false; }
}

function buyUpg(id) {
  const cost = upgCost(id); if (save.gold < cost || upgReq(id) > save.cleared) { Sfx.play('deny', 150); return; }
  save.gold -= cost; save.upg[id] = L(id) + 1; persist(); Sfx.play('buy'); refreshTop(); keepFocus(renderUpgrades);
}
function buyTower(t) {
  const cost = towerCost(t); if (save.gold < cost || TOWERS[t].req > save.cleared) { Sfx.play('deny', 150); return; }
  const was = save.tw[t] || 0; save.gold -= cost; save.tw[t] = was + 1;
  if (!was) { const free = save.slots.findIndex((x, i) => i < save.slotOpen && !x); if (free >= 0) save.slots[free] = t; toast(free >= 0 ? `${josa(TOWERS[t].name, '을', '를')} 자리 ${free + 1}에 배치했습니다` : `${josa(TOWERS[t].name, '을', '를')} 들였습니다. 성벽 자리에서 배치하세요`); }
  persist(); Sfx.play('buy'); refreshTop(); keepFocus(renderUpgrades);
}
function openSlot() {
  const s = SLOTS[save.slotOpen]; if (!s || save.gold < s.cost) return;
  save.gold -= s.cost; const i = save.slotOpen; save.slotOpen++;
  const used = new Set(save.slots.filter(Boolean)); save.slots[i] = TOWER_IDS.find(t => save.tw[t] && !used.has(t)) || 'archer';
  persist(); Sfx.play('buy'); refreshTop(); keepFocus(renderUpgrades);
}
let resetArmed = 0;
function resetProgress(btn) {
  if (Date.now() - resetArmed > 4000) { resetArmed = Date.now(); btn.textContent = '한 번 더 누르면 모든 진행이 지워집니다'; btn.classList.add('armed'); return; }
  resetArmed = 0; const keepNick = save.nick, keepSound = save.sound;
  save = newSave(); save.nick = keepNick; save.sound = keepSound; persist();
  selStage = 1; toast('처음부터 다시 시작합니다'); renderAll();
}

document.addEventListener('click', ev => {
  const el = ev.target.closest('[data-act]'); if (!el || el.disabled) return;
  const id = el.dataset.id;
  switch (el.dataset.act) {
    case 'tab': setTab(id); break;
    case 'sub': upTab = id; keepFocus(renderUpgrades); break;
    case 'stage': selStage = +id; keepFocus(renderStages); break;
    case 'go': if (selStage <= save.cleared + 1) startStage(selStage); break;
    case 'buy': buyUpg(id); break;
    case 'tw': buyTower(id); break;
    case 'slotset': save.slots[+el.dataset.slot] = id || null; persist(); refreshTop(); keepFocus(renderUpgrades); break;
    case 'slotopen': openSlot(); break;
    case 'rank': startRank(); break;
    case 'board': boardView = id; keepFocus(renderRanked); break;
    case 'skill': castSkill(id); break;
    case 'speed': toggleSpeed(); break;
    case 'pause': togglePause(); break;
    case 'resume': togglePause(false); break;
    case 'surrender': paused = false; closeModal(); lose(); break;
    case 'retry': startStage(lastStage); break;
    case 'next': startStage(lastStage + 1); break;
    case 'hub': exitBattle(); break;
    case 'hubUp': exitBattle(); setTab('upgrades'); break;
    case 'hubRank': exitBattle(); setTab('ranked'); break;
    case 'submit': submitRank(); break;
    case 'sound': save.sound = !save.sound; persist(); refreshTop(); if (save.sound) Sfx.ensure(); break;
    case 'reset': resetProgress(el); break;
  }
});

// ───────────────────────── shared ranking & cloud save (artifact runtime) ─────────────────────────
// Inside the claude.ai artifact viewer `window.claude.use` reaches a shared store: `rank/<viewer id>` holds each
// player's best run and `data/users/<id>/save` mirrors their progress. Anywhere else the game stays local-only.
const Cloud = {
  db: null, uid: null, board: [], boardLoaded: false, boardErr: false, pending: null, timer: 0, chain: Promise.resolve(),
  async init() {
    if (!window.claude || typeof window.claude.use !== 'function') return;
    try {
      const [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
      if (!db) return;
      this.db = db; boardView = 'online';
      this.uid = user ? await user.id() : null;
      db.collection('rank').orderBy('score', 'desc').limit(50).onSnapshot(snap => {
        this.board = snap.docs.map(d => cleanRow(d.id, d.data())).filter(Boolean);
        this.boardLoaded = true; this.boardErr = false;
        if (!B && currentTab === 'ranked') fillBoard();
      }, () => { this.boardErr = true; if (!B && currentTab === 'ranked') fillBoard(); });
      if (this.uid) {
        const snap = await db.doc(`data/users/${this.uid}/save`).get();
        const remote = snap.exists ? sanitize((snap.data() || {}).save) : null;
        if (remote && remote.savedAt > save.savedAt) { if (B) this.pending = remote; else this.adopt(remote); }
        else if (save.savedAt > 0) this.queue();
      }
      if (!B) renderAll();
    } catch (e) { console.warn('cloud unavailable', e); }
  },
  adopt(remote) {
    save = remote; selStage = Math.min(STAGE_COUNT, save.cleared + 1);
    try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch (e) { /* storage unavailable */ }
    renderAll(); toast('계정에 저장된 진행 상황을 불러왔습니다');
  },
  queue() { if (!this.db || !this.uid) return; clearTimeout(this.timer); this.timer = setTimeout(() => this.flush(), 1500); },
  flush() {
    const body = { save: JSON.parse(JSON.stringify(save)), at: Date.now() }, ref = this.db.doc(`data/users/${this.uid}/save`);
    this.chain = this.chain.then(() => ref.set(body)).catch(e => console.warn('cloud save failed', e));
  },
  async submit(rec) {
    if (!this.db || !this.uid) return { ok: false, reason: 'offline' };
    try {
      const ref = this.db.collection('rank').doc(this.uid), cur = await ref.get();
      const prev = cur.exists ? Math.floor(num((cur.data() || {}).score)) : -1;
      if (prev >= rec.score) return { ok: true, kept: true, prev };
      await ref.set({ score: rec.score, wave: rec.wave, kills: rec.kills, power: rec.power, nick: rec.nick, at: rec.at || Date.now() });
      return { ok: true };
    } catch (e) { return { ok: false, reason: e && e.code === 'invalid_argument' ? 'denied' : 'error' }; }
  },
};

// ───────────────────────── boot ─────────────────────────
if (location.hash === '#dev') {
  window.__ssj = {
    get B() { return B; }, get save() { return save; }, startStage, startRank, stats, power, update, castSkill, exitBattle,
    buyUpg, buyTower, openSlot, upgCost, towerCost, upgReq, UPG, TOWERS, SLOTS,
    give(n) { save.gold += n; persist(); renderAll(); }, clearTo(n) { save.cleared = n; persist(); renderAll(); },
  };
}
resize(); renderAll(); requestAnimationFrame(frame);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { bgKey = ''; });
Cloud.init();
})();
</script>
