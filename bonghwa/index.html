<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>봉화대 사수</title>
<style>
/* Layout: a fixed 1280×720 game screen scaled to the window — battlefield canvas on the left, shop and bag on the right.
   Palette: night-indigo panels, 봉화 amber for coin and focus, item tiers in grey/green/blue/orange. */
@font-face { font-family: 'Galmuri11'; src: url('fonts/Galmuri11.woff2') format('woff2'); font-display: block; }
:root {
  --void: #07080c; --bg: #0d1019; --panel: #141a27; --panel-2: #1a2132; --panel-3: #222b40; --line: #2d374d; --line-2: #3f4b66;
  --text: #dde3ee; --dim: #8b94aa; --faint: #5c6479; --gold: #f2c94c; --amber: #ee8a2c; --red: #e5534b; --green: #62d36e; --blue: #6aa8ff; --violet: #b995ff;
  --font: 'Galmuri11', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; height: 100%; background: var(--void); overflow: hidden; overscroll-behavior: none; }
body { color: var(--text); font-family: var(--font); -webkit-font-smoothing: none; -webkit-tap-highlight-color: transparent; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 1px; }
#stage { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
#screen { position: relative; flex: none; width: 1280px; height: 720px; overflow: hidden; background: var(--bg); font-size: 22px; line-height: 1.3; -webkit-user-select: none; user-select: none; touch-action: manipulation; }
canvas { image-rendering: pixelated; image-rendering: crisp-edges; }
.gold { color: var(--gold); } .bad { color: var(--red); } .dim { color: var(--dim); } .small { font-size: 16px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 6px 14px; min-height: 40px; background: var(--panel-2); border: 2px solid var(--line-2); box-shadow: inset 0 -3px 0 rgba(0,0,0,.35); color: var(--text); font-size: 20px; }
.btn:hover:not(:disabled) { border-color: var(--gold); }
.btn.primary { background: #2c3d22; border-color: #7fae55; color: #e9f7d6; }
.btn.primary:hover:not(:disabled) { border-color: var(--gold); }
.btn.danger { border-color: #8a3b36; color: #ffb4ad; }
.btn.big { font-size: 24px; min-height: 52px; padding: 8px 26px; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.on { border-color: var(--gold); color: var(--gold); }

/* battlefield */
#field { position: absolute; left: 0; top: 0; width: 800px; height: 720px; background: #000; }
#cv { position: absolute; left: 0; top: 0; width: 800px; height: 720px; }
#hud { position: absolute; left: 0; top: 0; right: 0; padding: 8px 12px 0; display: flex; flex-direction: column; gap: 4px; pointer-events: none; text-shadow: 2px 2px 0 #000; }
.hud-row { display: flex; align-items: center; gap: 16px; }
.hud-row b { color: var(--gold); } .hud-row b.boss { color: #ff7a6e; }
#hTime { color: var(--gold); min-width: 4.5em; } #hEnemy { color: #ff8a7a; }
#hArmor { font-size: 19px; }
.hud-btns { margin-left: auto; display: flex; gap: 6px; pointer-events: auto; }
.hud-btns .btn { min-height: 34px; font-size: 18px; padding: 2px 10px; text-shadow: none; }
#bossBar { position: absolute; left: 420px; right: 12px; top: 46px; padding: 2px 8px 4px; background: rgba(13,16,25,.82); border: 2px solid #6b3a8a; pointer-events: none; }
#bossName { font-size: 17px; color: #e7cdfa; text-align: center; }
.bbar { height: 10px; background: #2a1638; margin-top: 3px; } .bbar i { display: block; height: 100%; background: #b35ae6; }
#banner { position: absolute; left: 0; right: 0; top: 230px; text-align: center; pointer-events: none; animation: bannerIn 2.3s steps(12) both; text-shadow: 3px 3px 0 #000; }
#banner .b-title { font-size: 44px; color: #fff4dc; } #banner .b-sub { font-size: 22px; color: var(--gold); margin-top: 4px; }
#banner.boss .b-title { color: #ff8a7a; } #banner.gold .b-title { color: var(--gold); }
@keyframes bannerIn { 0% { opacity: 0; transform: translateY(-8px); } 10%, 80% { opacity: 1; transform: none; } 100% { opacity: 0; } }
#fieldBar { position: absolute; left: 8px; right: 8px; bottom: 8px; display: flex; gap: 6px; }
#fieldBar .btn { flex: 1; font-size: 18px; min-height: 40px; background: rgba(20,26,39,.9); }
#fieldBar .btn span { color: var(--gold); }
#fpanel { position: absolute; right: 8px; top: 108px; width: 404px; max-height: 548px; overflow: auto; padding: 10px 12px; background: rgba(13,16,25,.93); border: 2px solid var(--line-2); font-size: 18px; }
#fpanel h3 { margin: 0 0 8px; font-size: 22px; font-weight: 400; color: var(--gold); }
.sets { display: grid; gap: 6px; } .set { padding: 5px 8px; border: 2px solid var(--line); } .set.on { border-color: #7a6a33; background: #1b1a14; }
.steps { display: flex; flex-wrap: wrap; gap: 4px 10px; font-size: 16px; color: var(--faint); } .steps .lit { color: var(--gold); }
.mrow { display: grid; grid-template-columns: 120px 1fr auto; gap: 8px; align-items: center; margin-bottom: 4px; font-size: 17px; }
.mn { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; } .mbar { height: 8px; background: var(--panel-3); } .mbar i { display: block; height: 100%; }
.mv small { color: var(--dim); font-size: 14px; }
table.mt { border-collapse: collapse; width: 100%; font-size: 18px; } table.mt th, table.mt td { border: 2px solid var(--line); padding: 4px 6px; text-align: center; font-weight: 400; }
table.mt td.x2 { color: #111; background: var(--gold); }
#toast { position: absolute; left: 50%; bottom: 60px; transform: translateX(-50%); padding: 6px 14px; background: #f6efd9; color: #17131c; font-size: 18px; border: 2px solid #17131c; white-space: nowrap; }

/* shop side */
#side { position: absolute; left: 800px; top: 0; width: 480px; height: 720px; padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; background: var(--panel); border-left: 3px solid var(--line-2); }
#res { padding: 8px 10px; background: var(--panel-2); border: 2px solid var(--line); display: grid; gap: 3px; }
.res-row { display: flex; justify-content: space-between; align-items: baseline; }
#goldVal { color: var(--gold); font-size: 26px; } #goldVal::before { content: '◉ '; font-size: 18px; } #goldVal.deny { animation: deny .5s steps(4); }
@keyframes deny { 0%, 50% { color: var(--red); } 100% { color: var(--gold); } }
#incomeVal { color: #ffd98a; font-size: 18px; } #hpVal::before { content: '♥ '; color: var(--red); } #regenVal { color: var(--green); font-size: 18px; }
.hpbar { position: relative; height: 14px; background: #3a1414; border: 2px solid #17131c; }
.hpbar i { position: absolute; left: 0; top: 0; bottom: 0; } #hpFill { background: #57c45f; } #shFill { background: rgba(120,200,255,.75); height: 4px; top: auto; }
#defVal { display: flex; gap: 14px; font-size: 16px; color: var(--dim); }
#shop { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.card { position: relative; height: 70px; display: grid; grid-template-columns: 54px 1fr; grid-template-rows: auto auto auto; column-gap: 8px; align-items: center; padding: 4px 8px 4px 6px; text-align: left; background: var(--panel-2); border: 2px solid var(--line); border-left: 4px solid var(--tier, var(--line)); }
.card:hover:not(:disabled) { border-color: var(--gold); border-left-color: var(--tier); background: var(--panel-3); }
.card .ico { grid-row: span 3; width: 48px; height: 48px; image-rendering: pixelated; background: #0b0e16; border: 2px solid var(--tier, var(--line)); }
.card .nm { font-size: 20px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card .pr { font-size: 17px; color: var(--gold); } .card .tg { font-size: 15px; color: var(--dim); white-space: nowrap; overflow: hidden; }
.card .key { position: absolute; right: 6px; bottom: 2px; font-size: 16px; color: var(--faint); }
.card.poor .pr { color: var(--red); } .card.sold { background: #10141e; border-style: dashed; } .card.armed { border-color: var(--gold); }
#reroll { min-height: 38px; font-size: 19px; } #reroll .free { color: var(--green); }
#invTabs { display: flex; gap: 2px; border-bottom: 2px solid var(--line); }
#invTabs button { flex: 1; padding: 3px 0; background: none; border: 0; font-size: 16px; color: var(--dim); }
#invTabs button.on { color: var(--gold); box-shadow: inset 0 -3px 0 var(--gold); } #invTabs sup { font-size: 11px; color: var(--text); }
#inv { display: grid; grid-template-columns: repeat(8, 1fr); gap: 4px; }
.slot { aspect-ratio: 1; background: #0b0e16; border: 2px solid #1d2435; display: grid; place-items: center; }
.slot.full { border-color: var(--tier); cursor: pointer; } .slot.full:hover, .slot.sel { background: var(--panel-3); outline: 2px solid var(--gold); }
.slot img { width: 36px; height: 36px; image-rendering: pixelated; }
#sideFoot { margin-top: auto; display: flex; justify-content: space-between; font-size: 16px; color: var(--dim); }

/* tooltip */
#tip { position: absolute; z-index: 40; width: 330px; padding: 10px 12px; background: #0e121c; border: 2px solid var(--line-2); box-shadow: 4px 4px 0 rgba(0,0,0,.5); font-size: 17px; }
#tip p { margin: 4px 0 0; } #tip .t-h { display: flex; gap: 10px; align-items: center; } #tip .t-h img { width: 40px; height: 40px; image-rendering: pixelated; }
#tip .t-nm { font-size: 22px; } #tip .t-tg { font-size: 15px; color: var(--dim); } #tip .t-d { color: var(--dim); } #tip .hint { color: var(--faint); font-size: 15px; }
#tip .actions { margin-top: 8px; display: flex; gap: 6px; } #tip .actions .btn { font-size: 17px; min-height: 34px; }

/* modal */
#modal { position: absolute; inset: 0; z-index: 50; display: grid; place-items: center; background: rgba(5,6,10,.6); }
.mcard { width: 560px; max-height: 660px; overflow: auto; display: flex; flex-direction: column; gap: 12px; padding: 20px 24px; background: var(--panel); border: 3px solid var(--line-2); box-shadow: 6px 6px 0 rgba(0,0,0,.5); }
.mcard.wide { width: 760px; } .mcard.win { border-color: #b8923a; }
.mcard h2 { margin: 0; font-size: 30px; font-weight: 400; }
.eyebrow { font-size: 17px; color: var(--dim); }
.facts { display: grid; grid-template-columns: auto 1fr; gap: 4px 18px; margin: 0; } .facts dt { color: var(--dim); } .facts dd { margin: 0; } .facts .big { font-size: 28px; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; } .actions .btn { flex: 1; }
.rules { margin: 0; padding-left: 22px; display: grid; gap: 4px; font-size: 19px; } .rules b { color: var(--gold); font-weight: 400; }
.gifts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.gift { position: relative; display: flex; flex-direction: column; gap: 8px; padding: 14px; min-height: 150px; text-align: left; background: var(--panel-2); border: 2px solid #8a7334; }
.gift:hover { border-color: var(--gold); background: var(--panel-3); } .gift b { font-weight: 400; font-size: 22px; color: var(--gold); } .gift span { font-size: 17px; color: var(--dim); }
.gift .key { position: absolute; right: 8px; bottom: 6px; color: var(--faint); }
.submit { display: flex; gap: 8px; } .submit input, .field-row input { flex: 1; min-width: 0; padding: 6px 10px; background: #0b0e16; border: 2px solid var(--line-2); font-size: 20px; }

/* menus */
#menu { position: absolute; inset: 0; z-index: 30; }
#titleCv { position: absolute; inset: 0; width: 1280px; height: 720px; }
#menuBody { position: absolute; inset: 0; }
.title-wrap { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: flex-start; padding: 90px 0 0 150px; gap: 34px; }
.title-wrap .mnav { margin-left: 0; }
.logo { text-align: left; text-shadow: 4px 4px 0 #000; }
.logo h1 { margin: 0; font-size: 88px; font-weight: 400; color: #ffe2a8; letter-spacing: 6px; text-shadow: 4px 4px 0 #8c2b22, 8px 8px 0 #000; }
.logo-sub { font-size: 22px; color: var(--gold); }
.mnav { display: grid; gap: 8px; width: 320px; align-self: flex-start; margin-left: 150px; margin-top: 10px; }
.mbtn { display: flex; justify-content: center; align-items: center; gap: 10px; padding: 8px; background: rgba(13,16,25,.85); border: 2px solid var(--line-2); font-size: 24px; }
.mbtn:hover, .mbtn:focus-visible { border-color: var(--gold); color: var(--gold); }
.badge { font-size: 16px; padding: 0 6px; border: 2px solid var(--line-2); color: var(--text); } .badge.gold { color: var(--gold); border-color: #7a6a33; }
.corner { position: absolute; right: 16px; top: 16px; display: grid; gap: 4px; padding: 10px 14px; background: rgba(13,16,25,.8); border: 2px solid var(--line); font-size: 18px; }
.credit { position: absolute; left: 16px; right: 16px; bottom: 10px; font-size: 15px; color: var(--faint); text-align: center; text-shadow: 2px 2px 0 #000; }
.panel { position: absolute; left: 40px; top: 30px; right: 40px; bottom: 30px; display: flex; flex-direction: column; gap: 14px; padding: 18px 24px; background: rgba(13,16,25,.95); border: 3px solid var(--line-2); box-shadow: 6px 6px 0 rgba(0,0,0,.5); overflow: auto; }
.panel.narrow { left: 240px; right: 240px; }
.phead { display: flex; justify-content: space-between; align-items: center; } .phead h2 { margin: 0; font-size: 32px; font-weight: 400; color: var(--gold); }
.panel h3 { margin: 0; font-weight: 400; font-size: 24px; }
.lead { margin: 0; }
.sel-grid { display: grid; grid-template-columns: 380px 1fr; gap: 18px; flex: 1; min-height: 0; }
.dlist { display: grid; gap: 6px; align-content: start; }
.drow { display: flex; flex-direction: column; align-items: flex-start; padding: 8px 12px; background: var(--panel-2); border: 2px solid var(--line); text-align: left; }
.drow b { font-weight: 400; font-size: 24px; } .drow span { font-size: 16px; color: var(--dim); }
.drow.on { border-color: var(--gold); background: var(--panel-3); } .drow.locked { opacity: .5; cursor: not-allowed; }
.dview { display: flex; flex-direction: column; gap: 12px; }
#prevCv { width: 100%; height: auto; aspect-ratio: 300 / 90; border: 2px solid var(--line-2); background: #000; }
.dname { display: flex; align-items: baseline; gap: 14px; } .dname b { font-size: 32px; font-weight: 400; } .dname span { color: var(--dim); font-size: 18px; }
.reward { margin: 0; padding: 6px 10px; border: 2px solid #7a6a33; color: var(--gold); font-size: 18px; }
.dview .btn.big { align-self: flex-end; margin-top: auto; }
.perks { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
.perk { display: flex; flex-direction: column; gap: 6px; padding: 12px; background: var(--panel-2); border: 2px solid var(--line); }
.perk p { margin: 0; font-size: 18px; } .ph { display: flex; justify-content: space-between; } .ph b { font-weight: 400; font-size: 22px; } .ph .lv { color: var(--gold); }
.perk .btn { margin-top: auto; font-size: 17px; }
.rank-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 22px; flex: 1; min-height: 0; }
.rank-info { display: flex; flex-direction: column; gap: 12px; } .rank-info p { margin: 0; }
.field-row { display: flex; align-items: center; gap: 10px; font-size: 19px; color: var(--dim); }
.board-h { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
.seg { display: flex; border: 2px solid var(--line-2); } .seg button { background: var(--panel-2); border: 0; padding: 3px 12px; font-size: 17px; color: var(--dim); } .seg button.on { background: var(--gold); color: #17131c; }
.tbl { max-height: 470px; overflow: auto; border: 2px solid var(--line); }
table.rank { width: 100%; border-collapse: collapse; font-size: 18px; }
table.rank th { font-weight: 400; color: var(--dim); text-align: left; padding: 6px 8px; border-bottom: 2px solid var(--line); font-size: 16px; }
table.rank td { padding: 5px 8px; border-bottom: 1px solid var(--panel-3); white-space: nowrap; }
table.rank .r { text-align: right; } table.rank td.rk { color: var(--faint); } table.rank tbody tr:nth-child(-n+3) td.rk { color: var(--gold); }
table.rank tr.me td { background: #2a2a1a; } table.rank td.empty { text-align: center; color: var(--faint); padding: 18px; }
table.rank td.nick { max-width: 9em; overflow: hidden; text-overflow: ellipsis; }
.settings { display: flex; flex-direction: column; gap: 12px; align-items: flex-start; }
table.keys { border-collapse: collapse; font-size: 18px; } table.keys td { padding: 3px 12px 3px 0; } table.keys td:first-child { color: var(--gold); white-space: nowrap; }

#rotate { position: fixed; inset: 0; z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; padding: 24px; background: var(--void); color: var(--text); font-family: var(--font); font-size: 20px; text-align: center; }
#rotate .sym { font-size: 56px; color: var(--gold); }
@media (prefers-reduced-motion: reduce) { #banner { animation: none; } }
</style>
</head>
<body>
<div id="stage">
  <div id="screen">
    <section id="field" aria-label="전장">
      <canvas id="cv" width="400" height="360" aria-label="봉화대와 몰려오는 적"></canvas>
      <div id="hud">
        <div class="hud-row"><span id="hDiff"></span><span id="hRound"></span><span>남은 <span id="hTime"></span></span><span>적 <span id="hEnemy">0</span></span>
          <div class="hud-btns"><button class="btn" id="bPause" data-act="pause">Ⅱ 멈춤</button><button class="btn" id="bSpeed" data-act="speed">▶▶ ×1</button></div></div>
        <div class="hud-row" id="hArmor"></div>
      </div>
      <div id="bossBar" hidden><div id="bossName"></div><div class="bbar"><i id="bossFill"></i></div></div>
      <div id="banner" hidden></div>
      <div id="fpanel" hidden></div>
      <div id="toast" role="status" hidden></div>
      <div id="fieldBar">
        <button class="btn" id="bSmite" data-act="smite">천벌 [Z]</button>
        <button class="btn" data-act="fp" data-id="set">세트 [B]</button>
        <button class="btn" data-act="fp" data-id="meter">딜미터 [D]</button>
        <button class="btn" id="bRange" data-act="range">사거리 [G]</button>
        <button class="btn" data-act="fp" data-id="match">상성 [H]</button>
      </div>
    </section>

    <aside id="side" aria-label="상점과 가방">
      <div id="res">
        <div class="res-row"><span id="goldVal">0</span><span id="incomeVal"></span></div>
        <div class="res-row"><span id="hpVal"></span><span id="regenVal"></span></div>
        <div class="hpbar"><i id="hpFill"></i><i id="shFill"></i></div>
        <div id="defVal"></div>
      </div>
      <div id="shop"></div>
      <button class="btn" id="reroll" data-act="reroll">새로고침 [R]</button>
      <div id="invTabs"></div>
      <div id="inv"></div>
      <div id="sideFoot"><span id="invCount"></span><span>눌러서 살펴보기 · 되팔기</span></div>
    </aside>

    <div id="tip" hidden></div>

    <div id="menu">
      <canvas id="titleCv" width="640" height="360" aria-hidden="true"></canvas>
      <div id="menuBody"></div>
    </div>

    <div id="modal" hidden><div id="modalCard" class="mcard" role="dialog" aria-modal="true"></div></div>
  </div>
</div>
<div id="rotate" hidden>
  <div class="sym">⟳</div>
  <p>휴대폰을 가로로 돌려 주세요<br>봉화대 사수는 가로 화면에 맞춰져 있습니다</p>
  <button class="btn" data-act="rotate-skip">이대로 계속하기</button>
</div>
<noscript>이 게임은 자바스크립트가 필요합니다.</noscript>
<script src="data.js"></script>
<script src="art.js"></script>
<script src="game.js"></script>
</body>
</html>
