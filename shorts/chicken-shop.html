<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>비밀의 계산기 · 치킨집 편</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@500;700;900&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#000;overflow:hidden;font-family:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif}
  body.rec{cursor:none}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;overflow:hidden}
  #frame{position:relative;width:1080px;height:1920px;flex:none;transform-origin:center center;overflow:hidden;background:#070e22}
  #cv{position:absolute;inset:0;width:1080px;height:1920px;display:block}

  /* ── 쇼츠 자막 ── */
  #sub{position:absolute;left:40px;right:40px;top:1420px;display:flex;justify-content:center;pointer-events:none}
  #subBox{max-width:1000px;padding:22px 40px 26px;border-radius:28px;background:rgba(4,9,24,.78);
    border:2px solid rgba(255,255,255,.10);box-shadow:0 14px 40px rgba(0,0,0,.55);
    text-align:center;font:900 58px/1.36 "Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    color:#fff;letter-spacing:-1.5px;word-break:keep-all;
    opacity:0;transform:translateY(24px) scale(.94);transition:opacity .16s ease,transform .26s cubic-bezier(.2,1.5,.4,1)}
  #subBox.show{opacity:1;transform:none}
  #subBox .w{opacity:.38;transition:opacity .1s linear,text-shadow .1s linear}
  #subBox .w.on{opacity:1;text-shadow:0 3px 0 rgba(0,0,0,.45)}
  #subBox .kw{color:#FFC531}
  #subBox .neg{color:#FF5C5C}
  #subBox .pos{color:#3CE58F}

  /* ── 시작 / 종료 오버레이 (1080x1920 좌표계) ── */
  .overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    background:radial-gradient(circle at 50% 40%,rgba(22,48,106,.92),rgba(4,8,20,.97));z-index:5}
  .overlay.hidden{display:none}
  .ov{width:900px;text-align:center;color:#fff}
  .ov .tag{display:inline-block;padding:14px 34px;border:3px solid #FFC531;border-radius:60px;color:#FFC531;font-weight:900;font-size:40px;letter-spacing:2px}
  .ov h1{font-family:"Black Han Sans","Noto Sans KR",sans-serif;font-weight:400;font-size:122px;line-height:1.15;margin:46px 0 22px;letter-spacing:-2px}
  .ov h1 span{color:#FFC531}
  .ov .desc{font-size:38px;color:rgba(255,255,255,.7);margin:0 0 56px;font-weight:500}
  .ov button.big{font:900 64px "Noto Sans KR",sans-serif;color:#1a1300;background:#FFC531;border:0;border-radius:90px;
    padding:34px 110px;cursor:pointer;box-shadow:0 18px 50px rgba(255,197,49,.35);transition:transform .15s}
  .ov button.big:hover{transform:scale(1.04)}
  .ov button.big:disabled{opacity:.5;cursor:wait}
  .ov button.ghost{font:700 40px "Noto Sans KR",sans-serif;color:#fff;background:transparent;border:3px solid rgba(255,255,255,.35);
    border-radius:70px;padding:22px 60px;cursor:pointer;margin-top:30px}
  .opts{margin:60px auto 0;width:820px;text-align:left;background:rgba(255,255,255,.06);border:2px solid rgba(255,255,255,.1);
    border-radius:36px;padding:34px 44px;font-size:36px;font-weight:700;color:rgba(255,255,255,.9)}
  .opts .row{display:flex;align-items:center;gap:22px;margin:18px 0}
  .opts .row > span{min-width:170px;color:rgba(255,255,255,.6)}
  .opts select{flex:1;min-width:0;font:700 30px "Noto Sans KR",sans-serif;padding:14px 18px;border-radius:16px;border:2px solid rgba(255,255,255,.2);background:#0d1733;color:#fff}
  .opts input[type=range]{flex:1;height:40px;accent-color:#FFC531}
  .opts input[type=checkbox]{width:40px;height:40px;accent-color:#FFC531;margin:0}
  .opts label.chk{display:flex;align-items:center;gap:20px;margin:16px 0;cursor:pointer}
  .hint{font-size:28px;line-height:1.5;color:rgba(255,255,255,.55);margin:30px 0 0;font-weight:500}

  /* ── 화면 밖 HUD (녹화 모드에서 숨김) ── */
  #hud{position:fixed;left:12px;bottom:12px;z-index:10;display:flex;gap:8px;align-items:center;
    font:600 13px "Noto Sans KR",sans-serif;color:#fff;background:rgba(20,24,36,.85);padding:8px 10px;border-radius:12px;border:1px solid rgba(255,255,255,.12)}
  #hud button{font:700 12px "Noto Sans KR",sans-serif;color:#fff;background:#2a3350;border:0;border-radius:8px;padding:6px 10px;cursor:pointer}
  #hud .tc{font-variant-numeric:tabular-nums;min-width:118px}
  body.rec #hud{display:none}
</style>
</head>
<body>
<div id="wrap">
  <div id="frame">
    <canvas id="cv" width="1080" height="1920"></canvas>
    <div id="sub"><div id="subBox"></div></div>

    <div id="startUI" class="overlay">
      <div class="ov">
        <div class="tag">비밀의 계산기 · EP.01</div>
        <h1>치킨 한 마리 팔면<br><span>얼마</span> 남을까?</h1>
        <p class="desc">음성 나레이션 + 실시간 자막 + 모션 그래픽</p>
        <button id="btnStart" class="big" disabled>불러오는 중…</button>
        <div class="opts">
          <div class="row"><span>목소리</span><select id="selVoice"></select></div>
          <div class="row"><span>말 속도</span><input type="range" id="rngRate" min="0.85" max="1.4" step="0.05" value="1.2"><b id="rateVal">1.20</b></div>
          <label class="chk"><input type="checkbox" id="chkTTS" checked> 음성 나레이션 (TTS)</label>
          <label class="chk"><input type="checkbox" id="chkBGM" checked> 배경음악</label>
          <label class="chk"><input type="checkbox" id="chkSFX" checked> 효과음</label>
          <label class="chk"><input type="checkbox" id="chkRec"> 녹화 모드 (화면 밖 버튼·커서 숨김)</label>
        </div>
        <p class="hint" id="voiceHint">Chrome · Edge 권장. Edge의 ‘SunHi / InJoon Online (Natural)’ 음성이 가장 자연스럽습니다.</p>
      </div>
    </div>

    <div id="endUI" class="overlay hidden">
      <div class="ov">
        <div class="tag">비밀의 계산기 · EP.01</div>
        <h1>치킨집 편<br><span>끝</span></h1>
        <button id="btnReplay" class="big">⟲ 다시 보기</button><br>
        <button id="btnHome" class="ghost">설정 화면으로</button>
      </div>
    </div>
  </div>
</div>

<div id="hud">
  <span class="tc" id="tc">00:00.0 / 00:00</span>
  <button id="hudRestart" title="R">⟲ 처음부터 (R)</button>
  <button id="hudRec" title="H">녹화 모드 (H)</button>
</div>

<script>
(() => {
'use strict';
/* ════════════════════════════════════════════════════════════════════
   0. 기본 설정
   ════════════════════════════════════════════════════════════════════ */
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
const W = 1080, H = 1920;
const FD = '"Black Han Sans","Noto Sans KR",sans-serif';                      // 디스플레이(제목·숫자)
const FB = '"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif'; // 본문
const FE = '"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
const C = {
  gold:'#FFC531', red:'#FF4D4D', green:'#35E08A', cyan:'#6FD3FF', ink:'#1d2433',
  paper:'#F6F1E4', dim:'rgba(255,255,255,.6)', line:'#d6e8ff'
};

/* ════════════════════════════════════════════════════════════════════
   1. 대본 큐 (자막 표기: [노랑 키워드] {빨강} <초록>,  say = TTS 발음 보정)
      t·dur 은 plan() 이 말 속도에 맞춰 자동 계산 → 모션·자막·효과음이 같은 시계로 움직임
   ════════════════════════════════════════════════════════════════════ */
const DED = [[0.05,'swipe'],[0.2,'minus']];
const CUES = [
  {id:'h1', sc:'hook',    text:'전 세계 [맥도날드]보다 많은 게, 한국에 있습니다.', min:2.8, sfx:[[0,'whoosh'],[0.3,'roll'],[1.2,'roll']]},
  {id:'h2', sc:'hook',    text:'바로, [치킨집]이죠.', min:1.7, sfx:[[0.05,'impact']], shake:[[0.05,24,.55]], flash:[[0.05,.35]]},
  {id:'s1', sc:'store',   text:'치킨 한 마리 [2만 원]. 꽤 남을 것 같죠?', say:'치킨 한 마리 이만 원. 꽤 남을 것 같죠?', min:2.9, sfx:[[0,'whoosh'],[0.65,'stamp'],[1.7,'pop']], shake:[[0.7,10,.3]]},
  {id:'d0', sc:'deduct',  text:'이 [2만 원], 하나씩 빼볼게요.', say:'이 이만 원, 하나씩 빼 볼게요.', min:1.9, sfx:[[0,'whoosh'],[0.2,'rise']]},
  {id:'d1', sc:'deduct',  text:'생닭, 본사 공급가 {5천5백 원}.', say:'생닭, 본사 공급가 오천오백 원.', min:1.5, sfx:DED},
  {id:'d2', sc:'deduct',  text:'기름·파우더·소스 {2천5백 원}.', say:'기름, 파우더, 소스 이천오백 원.', min:1.5, sfx:DED},
  {id:'d3', sc:'deduct',  text:'무, 콜라, 포장 박스 {1천5백 원}.', say:'무, 콜라, 포장 박스 천오백 원.', min:1.5, sfx:DED},
  {id:'d4', sc:'deduct',  text:'배달앱과 카드 수수료 {2천 원}.', say:'배달앱과 카드 수수료 이천 원.', min:1.5, sfx:DED},
  {id:'d5', sc:'deduct',  text:'배달 대행비 {3천 원}.', say:'배달 대행비 삼천 원.', min:1.4, sfx:DED},
  {id:'d6', sc:'deduct',  text:'월세·인건비를 한 마리로 나누면 {3천5백 원}.', say:'월세, 인건비를 한 마리로 나누면, 삼천오백 원.', min:2.4, sfx:[...DED,[1.4,'pop']]},
  {id:'c1', sc:'calc',    text:'[계산기를 두드려보면] 머리가 {띵해지는} 순간이죠.', min:2.9, sfx:[[0,'whoosh'],
      ...['2','0','0','0','0','−','1','8','0','0','0','='].map((_,i)=>[0.2+i*0.1,'click']),[1.42,'ding'],[1.42,'impact']],
      shake:[[1.42,30,.9]], flash:[[1.42,.6]]},
  {id:'p1', sc:'profit',  text:'2만 원짜리 치킨을 팔면,', say:'이만 원짜리 치킨을 팔면,', min:1.6, sfx:[[0,'whoosh'],[0.15,'rise'],[1.0,'pop']]},
  {id:'p2', sc:'profit',  text:'사장님 손에 남는 건 고작 <2천 원>.', say:'사장님 손에 남는 건, 고작 이천 원.', min:2.4, sfx:[[1.2,'coin']]},
  {id:'f1', sc:'fifty',   text:'한 달 [300만 원]을 벌려면,', say:'한 달에 삼백만 원을 벌려면,', min:1.9, sfx:[[0,'whoosh'],[0.05,'stamp'],[0.7,'pop']]},
  {id:'f2', sc:'fifty',   text:'매일 {50마리}를 쉬지 않고 튀겨야 하죠.', say:'매일 오십 마리를, 쉬지 않고 튀겨야 하죠.', min:2.9,
      sfx:[...Array.from({length:25},(_,i)=>[0.15+i*0.08,'tick']),[2.3,'stamp']], shake:[[2.32,9,.3]]},
  {id:'x1', sc:'closure', text:'그래서 매년, 여는 집보다 {닫는 집}이 더 많습니다.', min:3.0, sfx:[[0,'whoosh'],[0.15,'rise'],[1.2,'rise'],[2.4,'stamp'],[2.42,'buzz']], shake:[[2.42,12,.35]]},
  {id:'t1', sc:'twist',   text:'그런데 이상하죠?', min:1.5, sfx:[[0,'scratch'],[0.02,'impact']], shake:[[0.02,20,.5]], flash:[[0,.5]]},
  {id:'t2', sc:'twist',   text:'이렇게 빠듯한데, 치킨 [본사]는 왜 계속 커질까요?', min:2.6, sfx:[[0.1,'rumble']], shake:[[0.1,7,1.1]]},
  {id:'k1', sc:'secret',  text:'비밀은 아까 뺀 비용에 있습니다.', min:2.3, sfx:[[0,'rewind'],[0.6,'marker'],[0.85,'marker'],[1.1,'marker'],[1.45,'pop']]},
  {id:'k2', sc:'supply',  text:'[닭], [기름], [소스], [박스].', say:'닭, 기름, 소스, 박스.', min:1.8, sfx:[[0.05,'pop'],[0.43,'pop'],[0.81,'pop'],[1.19,'pop']]},
  {id:'k3', sc:'supply',  text:'점주는 이걸 [본사에서만] 사야 합니다.', min:2.0, sfx:[[0.95,'lock']], shake:[[1.0,10,.3]]},
  {id:'m1', sc:'supply',  text:'본사는 물건을 넘길 때마다 [마진]을 붙이죠.', min:2.6, sfx:[[0.55,'coin'],[0.97,'coin'],[1.39,'coin'],[1.81,'coin'],[2.23,'coin']]},
  {id:'m2', sc:'supply',  text:'치킨이 팔리기도 전에, 본사는 {이미} 번 거죠.', min:2.6, sfx:[[1.4,'kaching']], shake:[[1.4,10,.3]]},
  {id:'g1', sc:'gold',    text:'골드러시 때 가장 큰돈을 번 사람은,', min:1.9, sfx:[[0,'whoosh'],[0.1,'shimmer']]},
  {id:'g2', sc:'gold',    text:'금 캔 사람이 아니라, [곡괭이와 청바지] 판 사람이었죠.', min:2.8, sfx:[[0.75,'buzz'],[1.75,'win']]},
  {id:'g3', sc:'gold',    text:'치킨 전쟁의 진짜 승자도,', min:1.5, sfx:[[0.05,'morph']]},
  {id:'g4', sc:'gold',    text:'튀기는 사람이 아니라, [닭을 대주는 사람]입니다.', min:2.6, sfx:[[0.55,'buzz'],[1.35,'impact'],[1.4,'win']], shake:[[1.35,16,.45]]},
  {id:'o1', sc:'outro',   text:'다른 가게 돈 구조도 궁금하면, [구독]!', say:'다른 가게 돈 구조도 궁금하면, 구독!', min:2.8, sfx:[[0,'whoosh'],[0.2,'pop'],[0.45,'pop'],[0.7,'pop'],[1.7,'click'],[1.75,'ding2']]},
];

/* ════════════════════════════════════════════════════════════════════
   2. 유틸
   ════════════════════════════════════════════════════════════════════ */
const clamp = (v,a=0,b=1) => v<a?a:v>b?b:v;
const lerp = (a,b,t) => a+(b-a)*t;
const P = (t,s,d) => clamp((t-s)/d);
const E = {
  out:t=>1-Math.pow(1-t,3),
  io:t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2,
  back:t=>{const c=1.70158;return 1+(c+1)*Math.pow(t-1,3)+c*Math.pow(t-1,2)},
  elastic:t=>t<=0?0:t>=1?1:Math.pow(2,-10*t)*Math.sin((t*10-.75)*2*Math.PI/3)+1,
  bounce:t=>{const n=7.5625,d=2.75;if(t<1/d)return n*t*t;if(t<2/d)return n*(t-=1.5/d)*t+.75;if(t<2.5/d)return n*(t-=2.25/d)*t+.9375;return n*(t-=2.625/d)*t+.984375}
};
const rnd = n => {const x=Math.sin(n*127.1+311.7)*43758.5453;return x-Math.floor(x)};
const won = n => Math.round(n).toLocaleString('ko-KR');
const strip = s => s.replace(/[\[\]{}<>]/g,'');

function rr(x,y,w,h,r){
  r=Math.min(r,w/2,h/2);ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();
}
function text(s,x,y,o={}){
  ctx.save();
  const disp=o.f==='D';
  ctx.font=`${disp?400:(o.w||800)} ${o.s||48}px ${disp?FD:FB}`;
  ctx.textAlign=o.a||'center';ctx.textBaseline='middle';
  if(o.alpha!=null)ctx.globalAlpha*=o.alpha;
  if(o.glow){ctx.shadowColor=o.glow;ctx.shadowBlur=o.gb||30;}
  if(o.st){ctx.lineJoin='round';ctx.lineWidth=o.st;ctx.strokeStyle=o.sc||'rgba(0,0,0,.85)';ctx.strokeText(s,x,y);}
  ctx.fillStyle=o.c||'#fff';ctx.fillText(s,x,y);
  ctx.restore();
}
function emoji(ch,x,y,size,o={}){
  ctx.save();ctx.translate(x,y);if(o.rot)ctx.rotate(o.rot);
  const sc=o.sc??1;if(sc!==1)ctx.scale(sc,sc);
  if(o.alpha!=null)ctx.globalAlpha*=o.alpha;
  if(o.gray&&'filter' in ctx)ctx.filter='grayscale(1) brightness(.75)';
  ctx.font=`${size}px ${FE}`;ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillStyle='#000';ctx.fillText(ch,0,size*0.05);ctx.restore();
}
function group(x,y,sc,rot,alpha,fn){
  ctx.save();ctx.translate(x,y);if(rot)ctx.rotate(rot);if(sc!==1)ctx.scale(sc,sc);
  ctx.globalAlpha*=alpha;fn();ctx.restore();
}
function line(x1,y1,x2,y2){ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();}
function coin(x,y,r,alpha=1){
  ctx.save();ctx.globalAlpha*=alpha;
  const g=ctx.createRadialGradient(x-r*.3,y-r*.35,r*.1,x,y,r);
  g.addColorStop(0,'#FFF1A8');g.addColorStop(.55,'#FFC531');g.addColorStop(1,'#C98A00');
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle='rgba(120,70,0,.6)';ctx.lineWidth=r*.09;ctx.beginPath();ctx.arc(x,y,r*.78,0,Math.PI*2);ctx.stroke();
  ctx.restore();
  text('₩',x,y+r*.04,{f:'D',s:r*1.05,c:'#8a5a00',alpha});
}
function stampBox(str,x,y,t,o={}){
  if(t<0)return;
  const k=E.out(P(t,0,.2)),sz=o.s||80,col=o.c||C.red;
  group(x,y,lerp(2.3,1,k),o.rot??-0.12,P(t,0,.1),()=>{
    ctx.font=`400 ${sz}px ${FD}`;
    const w=ctx.measureText(str).width+80,h=sz*1.5;
    ctx.fillStyle=o.bg||'rgba(0,0,0,.35)';rr(-w/2,-h/2,w,h,20);ctx.fill();
    ctx.lineWidth=10;ctx.strokeStyle=col;rr(-w/2,-h/2,w,h,20);ctx.stroke();
    text(str,0,4,{f:'D',s:sz,c:col});
  });
}
function dashed(x1,y,x2,col){ctx.save();ctx.setLineDash([12,10]);ctx.strokeStyle=col;ctx.lineWidth=3;line(x1,y,x2,y);ctx.restore();}

/* ════════════════════════════════════════════════════════════════════
   3. 공용 그래픽 (영수증 · 본사 빌딩 · 가맹점)
   ════════════════════════════════════════════════════════════════════ */
const COSTS = [
  {id:'d1', ic:'🐔', lb:'생닭 (본사 공급)',     v:5500},
  {id:'d2', ic:'🛢️', lb:'기름·파우더·소스',     v:2500},
  {id:'d3', ic:'📦', lb:'무·콜라·포장재',       v:1500},
  {id:'d4', ic:'📱', lb:'배달앱·카드 수수료',   v:2000},
  {id:'d5', ic:'🛵', lb:'배달 대행비',          v:3000},

/* ════════════════════════════════════════════════════════════════════
   6. 타임라인 계획 (말 속도 기반 자동 타이밍)
   ════════════════════════════════════════════════════════════════════ */
let PLAN=null;
function estimate(s,rate){
  const syl=s.replace(/[^가-힣0-9A-Za-z]/g,'').length;
  const pauses=(s.match(/[,.?!]/g)||[]).length;
  return syl/(5.4*rate)+pauses*.16+.2;
}
function plan(rate){
  let t=0;const ev=[],shakes=[],flashes=[];CT={};
  for(const c of CUES){
    c.say_=c.say||strip(c.text);
    c.est=estimate(c.say_,rate);
    const maxOff=Math.max(0,...(c.sfx||[]).map(s=>s[0]));
    c.t=t;c.dur=Math.max(c.min||0,c.est+.12,maxOff+.15);
    CT[c.id]=t;
    (c.sfx||[]).forEach(([o,n])=>ev.push({t:t+o,n}));
    (c.shake||[]).forEach(([o,a,d])=>shakes.push({t:t+o,a,d}));
    (c.flash||[]).forEach(([o,a])=>flashes.push({t:t+o,a,d:.3}));
    t+=c.dur;
  }
  ev.sort((x,y)=>x.t-y.t);
  const scenes=[];CUES.forEach(c=>{if(!scenes.length||scenes[scenes.length-1].id!==c.sc)scenes.push({id:c.sc,t:c.t});});
  PLAN={ev,shakes,flashes,scenes,end:t+.6};
  return PLAN;
}
function sceneIndexAt(t){let i=0;for(let k=0;k<PLAN.scenes.length;k++)if(PLAN.scenes[k].t<=t)i=k;return i;}

  bgmBus=ac.createGain();bgmBus.gain.value=.22;bgmBus.connect(master);
  NOISE=ac.createBuffer(1,ac.sampleRate*3,ac.sampleRate);
  const d=NOISE.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
}
function tone(type,f0,f1,t,dur,vol,dest=sfxBus,att=.005){
  const o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.setValueAtTime(f0,t);
  if(f1&&f1!==f0)o.frequency.exponentialRampToValueAtTime(f1,t+dur);
  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+att);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g);g.connect(dest);o.start(t);o.stop(t+dur+.05);
}
function nz(t,dur,vol,type,f0,f1,q=1,dest=sfxBus,att=.005){
  const s=ac.createBufferSource();s.buffer=NOISE;
  const f=ac.createBiquadFilter();f.type=type;f.Q.value=q;f.frequency.setValueAtTime(f0,t);
  if(f1)f.frequency.exponentialRampToValueAtTime(f1,t+dur);
  const g=ac.createGain();g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+att);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  s.connect(f);f.connect(g);g.connect(dest);s.start(t,Math.random()*1.2);s.stop(t+dur+.05);
}
const SFX={
  whoosh:t=>nz(t,.45,.35,'bandpass',300,3500,1.2,sfxBus,.15),
  swipe:t=>nz(t,.22,.3,'highpass',1500,6000,.7,sfxBus,.03),
  pop:t=>tone('sine',380,980,t,.13,.45),
  click:t=>{tone('square',2200,1800,t,.035,.1);nz(t,.03,.15,'highpass',4000,null,.7);},
  tick:t=>tone('triangle',2400,null,t,.03,.1),
  roll:t=>{for(let i=0;i<9;i++)tone('triangle',1800+i*90,null,t+i*.075,.03,.08);},
  minus:t=>tone('triangle',620,240,t,.22,.3),
  rise:t=>{tone('sine',180,720,t,.6,.16,sfxBus,.25);nz(t,.6,.1,'bandpass',400,2400,1,sfxBus,.3);},
  stamp:t=>{tone('sine',150,45,t,.3,.8);nz(t,.12,.4,'lowpass',1200,300,.7);},
  impact:t=>{tone('sine',110,32,t,.75,.95);nz(t,.35,.5,'lowpass',2000,200,.7);tone('square',55,40,t,.25,.12);},
  ding:t=>{[[1318,.32,1.8],[2637,.12,1.2],[3520,.07,.9]].forEach(([f,v,d])=>tone('sine',f,null,t,d,v,sfxBus,.003));tone('sine',4200,null,t+.05,1.5,.03,sfxBus,.25);},
  ding2:t=>tone('sine',2093,null,t,1.0,.15,sfxBus,.003),
  coin:t=>{tone('square',1568,null,t,.08,.1);tone('square',2093,null,t+.08,.35,.1);},
  kaching:t=>{nz(t,.06,.35,'bandpass',5000,null,2);tone('triangle',2637,null,t+.04,.5,.25);tone('triangle',3136,null,t+.12,.6,.2);tone('sine',90,40,t,.2,.4);},
  scratch:t=>{nz(t,.12,.55,'bandpass',3000,600,3);nz(t+.12,.18,.45,'bandpass',600,2800,3);},
  rumble:t=>{tone('sine',48,38,t,1.3,.6,sfxBus,.2);nz(t,1.3,.35,'lowpass',260,120,.7,sfxBus,.3);},
  rewind:t=>{for(let i=0;i<7;i++)tone('sawtooth',1400,500,t+i*.08,.075,.06);},
  marker:t=>nz(t,.28,.16,'bandpass',2600,3400,4,sfxBus,.04),
  lock:t=>{tone('square',900,600,t,.05,.15);SFX.stamp(t+.06);},
  shimmer:t=>{[1047,1319,1568,2093,2637].forEach((f,i)=>tone('sine',f,null,t+i*.07,.5,.07));},
  win:t=>{[523,659,784,1047].forEach((f,i)=>tone('triangle',f,null,t+i*.08,.35,.18));SFX.ding2(t+.32);},
  morph:t=>{tone('sine',260,1300,t,.45,.2,sfxBus,.1);SFX.whoosh(t);},
  buzz:t=>tone('square',120,110,t,.4,.1),
};
function playSfx(n){if(!ac||!opt.sfx||!SFX[n])return;try{SFX[n](ac.currentTime+.005);}catch(e){}}
const BPM=104,STEP=60/BPM/2,BASS=[55,55,43.65,49];
function bgmStep(s,t){
  const id=PLAN.scenes[sceneIndexAt(T)].id,dark=id==='twist',i=s%8,bar=Math.floor(s/8)%4;
  if(!dark){
    if(i===0||i===3||i===4){tone('sine',150,45,t,.2,i===3?.4:.65,bgmBus);}
    if(i===2||i===6)nz(t,.09,.3,'bandpass',1800,null,1,bgmBus);
    if(i%2)nz(t,.035,.14,'highpass',8000,null,.7,bgmBus);
    if(i===0)tone('triangle',BASS[bar]*2,null,t,STEP*3,.4,bgmBus,.02);
    if(i===4)tone('triangle',BASS[bar]*3,null,t,STEP*1.5,.18,bgmBus,.02);
  }else if(i===0){tone('sawtooth',BASS[bar],null,t,STEP*8,.12,bgmBus,.3);}
}
function startBGM(){
  stopBGM();if(!opt.bgm)return;
  nextNote=ac.currentTime+.08;step=0;
  bgmTimer=setInterval(()=>{while(nextNote<ac.currentTime+.15){bgmStep(step,nextNote);nextNote+=STEP;step++;}},25);
}
function stopBGM(){if(bgmTimer){clearInterval(bgmTimer);bgmTimer=null;}}

/* ════════════════════════════════════════════════════════════════════
   8. 음성(TTS) — speechSynthesis, ko-KR
   ════════════════════════════════════════════════════════════════════ */
const synth=window.speechSynthesis||null;
let voices=[],speakToken=0;
const st={done:true,endAt:0,started:false,waitUntil:0,onstartOK:false,uStart:0,est:1,bIdx:0,usedB:false,sayLen:1,fakeEnd:0};
function voiceScore(v){const n=v.name;return(/Natural|Neural|Online|Premium|Enhanced/i.test(n)?30:0)+(/Google/i.test(n)?20:0)+(/InJoon|SunHi|Yuna|Heami/i.test(n)?5:0)+(v.localService?0:1);}
function loadVoices(){
  if(!synth)return;
  voices=synth.getVoices().filter(v=>/^ko/i.test(v.lang)||/korean|한국/i.test(v.name)).sort((a,b)=>voiceScore(b)-voiceScore(a));
  const sel=document.getElementById('selVoice'),prev=sel.value;
  sel.innerHTML='';
  if(!voices.length){sel.innerHTML='<option value="">(한국어 음성을 찾는 중… 없으면 자막만 재생)</option>';return;}
  voices.forEach((v,i)=>{const o=document.createElement('option');o.value=v.name;o.textContent=`${v.name}${i===0?'  ★추천':''}`;sel.appendChild(o);});
  if(prev&&voices.some(v=>v.name===prev))sel.value=prev;
}
if(synth){loadVoices();synth.onvoiceschanged=loadVoices;}
function speak(text){
  const tok=++speakToken;
  const u=new SpeechSynthesisUtterance(text);
  u.lang='ko-KR';if(opt.voice)u.voice=opt.voice;u.rate=opt.rate;u.pitch=1;u.volume=1;
  const fin=()=>{if(tok!==speakToken||st.done)return;st.done=true;st.endAt=performance.now()/1000;};
  u.onstart=()=>{if(tok!==speakToken)return;st.started=true;st.onstartOK=true;st.uStart=performance.now()/1000;};
  u.onend=fin;u.onerror=fin;
  u.onboundary=e=>{if(tok!==speakToken)return;st.usedB=true;st.bIdx=e.charIndex+(e.charLength||1);};
  window.__utter=u;                      // Chrome GC 버그 방지(onend 누락)
  synth.speak(u);
  setTimeout(fin,(st.est*1.8+2)*1000);   // 안전장치: onend 미발생 시
}

/* ════════════════════════════════════════════════════════════════════
   9. 실시간 자막
   ════════════════════════════════════════════════════════════════════ */
const subBox=document.getElementById('subBox');let subWords=[],subLen=1;
function showSub(c){
  subBox.classList.remove('show');subBox.innerHTML='';subWords=[];
  let pos=0;
  const re=/\[([^\]]+)\]|\{([^}]+)\}|<([^>]+)>|([^\[{<]+)/g;let m;
  const add=(s,cls)=>{
    s.split(/(\s+)/).forEach(tok=>{
      if(!tok)return;
      if(/^\s+$/.test(tok)){subBox.appendChild(document.createTextNode(' '));return;}
      const sp=document.createElement('span');sp.className='w'+(cls?' '+cls:'');sp.textContent=tok;subBox.appendChild(sp);
      subWords.push({el:sp,start:pos,on:false});pos+=tok.length;
    });
  };
  while((m=re.exec(c.text))){if(m[1])add(m[1],'kw');else if(m[2])add(m[2],'neg');else if(m[3])add(m[3],'pos');else add(m[4],'');}
  subLen=Math.max(1,pos);
  void subBox.offsetWidth;subBox.classList.add('show');
}
function updateSub(now){
  if(!subWords.length)return;
  let p;
  if(st.done)p=1;
  else if(st.usedB)p=clamp(st.bIdx/st.sayLen);
  else if(!st.started)p=0;
  else p=clamp((now-st.uStart)/(st.est*.9));
  const pos=p*subLen+.5;
  for(const w of subWords){const on=w.start<pos;if(on!==w.on){w.on=on;w.el.classList.toggle('on',on);}}
}
function hideSub(){subBox.classList.remove('show');}

/* ════════════════════════════════════════════════════════════════════
   10. 재생 엔진 — 타임라인 T 는 '다음 큐 시작' 지점에서 음성이 끝날 때까지 대기(홀드)
       → 어떤 음성/속도에서도 나레이션·자막·모션·효과음이 어긋나지 않음
   ════════════════════════════════════════════════════════════════════ */
let phase='idle',cueIdx=-1,evIdx=0,last=0,endTimer=null;
const GAP=.12;
function startCue(i,now){
  cueIdx=i;const c=CUES[i];
  showSub(c);
  Object.assign(st,{done:false,started:false,usedB:false,bIdx:0,est:c.est,uStart:now,sayLen:Math.max(1,c.say_.length)});
  if(opt.tts&&synth){
    st.waitUntil=now+(i===0?1.6:(st.onstartOK?.9:0));
    speak(c.say_);
  }else{st.started=true;st.waitUntil=0;st.fakeEnd=now+c.est;}
}
function fireEvents(){while(evIdx<PLAN.ev.length&&PLAN.ev[evIdx].t<=T){playSfx(PLAN.ev[evIdx].n);evIdx++;}}
function advance(dt,now){
  if(!(opt.tts&&synth)&&!st.done&&now>=st.fakeEnd){st.done=true;st.endAt=st.fakeEnd;}
  if(!st.started&&now<st.waitUntil)return;          // 음성 시작 대기
  const next=CUES[cueIdx+1],boundary=next?next.t:PLAN.end;
  let nt=T+dt;
  if(nt>=boundary){
    if(!(st.done&&now-st.endAt>=GAP)){nt=boundary-1e-4;}  // 홀드
    else if(next){T=boundary;fireEvents();startCue(cueIdx+1,now);return;}
    else{T=PLAN.end;finish();return;}
  }
  T=Math.max(T,nt);fireEvents();
}
function finish(){
  phase='end';hideSub();stopBGM();
  if(ac)bgmBus.gain.setTargetAtTime(.22,ac.currentTime,.1);
  endTimer=setTimeout(()=>document.getElementById('endUI').classList.remove('hidden'),900);
}
function readOptions(){
  opt.tts=document.getElementById('chkTTS').checked;
  opt.bgm=document.getElementById('chkBGM').checked;
  opt.sfx=document.getElementById('chkSFX').checked;
  opt.rate=parseFloat(document.getElementById('rngRate').value);
  const name=document.getElementById('selVoice').value;
  opt.voice=voices.find(v=>v.name===name)||voices[0]||null;
  if(!opt.voice)opt.tts=false;           // 한국어 음성이 없으면 자막 전용 모드
  document.body.classList.toggle('rec',document.getElementById('chkRec').checked);
  fit();
}
function play(){
  readOptions();initAudio();ac.resume();
  const busy=synth&&(synth.speaking||synth.pending);
  if(synth)synth.cancel();speakToken++;
  stopBGM();hideSub();clearTimeout(endTimer);
  plan(opt.rate);
  document.getElementById('startUI').classList.add('hidden');
  document.getElementById('endUI').classList.add('hidden');
  T=0;evIdx=0;cueIdx=-1;phase='ready';
  const go=()=>{phase='play';last=performance.now();startBGM();fireEvents();startCue(0,performance.now()/1000);};
  if(busy)setTimeout(go,150);else go();   // Chrome: cancel 직후 speak 누락 방지
}
function toMenu(){
  if(synth)synth.cancel();speakToken++;stopBGM();hideSub();clearTimeout(endTimer);
  phase='idle';T=0;
  document.getElementById('endUI').classList.add('hidden');
  document.getElementById('startUI').classList.remove('hidden');
}

/* ════════════════════════════════════════════════════════════════════
   11. 렌더 루프
   ════════════════════════════════════════════════════════════════════ */
function render(){
  ctx.setTransform(1,0,0,1,0,0);ctx.globalAlpha=1;
  drawBG();
  if(phase!=='idle'&&PLAN){
    const sh=fxAt(PLAN.shakes,.4);
    ctx.save();
    if(sh>0){const k=Math.floor(R*60);ctx.translate((rnd(k)-.5)*2*sh,(rnd(k+7)-.5)*2*sh);}
    const si=sceneIndexAt(T),sc=PLAN.scenes[si],lt=T-sc.t,xf=SCENES[sc.id].xf??.35;
    if(si>0&&lt<xf){
      ctx.save();ctx.globalAlpha=1-lt/xf;SCENES[PLAN.scenes[si-1].id].draw();ctx.restore();
      ctx.save();ctx.globalAlpha=lt/xf;SCENES[sc.id].draw();ctx.restore();
    }else SCENES[sc.id].draw();
    ctx.restore();
    const fl=fxAt(PLAN.flashes,.3);
    if(fl>0){ctx.fillStyle=`rgba(255,255,255,${fl})`;ctx.fillRect(0,0,W,H);}
  }
  vignette();drawTop();
}
const tcEl=document.getElementById('tc');
const mmss=s=>{s=Math.max(0,s);const m=Math.floor(s/60);return String(m).padStart(2,'0')+':'+(s-m*60).toFixed(1).padStart(4,'0');};
function loop(ms){
  const dt=Math.min(.05,(ms-last)/1000);last=ms;R=ms/1000;
  const now=ms/1000;
  if(phase==='play'){
    advance(dt,now);updateSub(now);
    if(ac&&opt.bgm)bgmBus.gain.setTargetAtTime(st.started&&!st.done?.15:.24,ac.currentTime,.15);
  }
  render();
  tcEl.textContent=`${mmss(T)} / ${mmss(PLAN?PLAN.end:0)}`;
  requestAnimationFrame(loop);
}

/* ════════════════════════════════════════════════════════════════════
   12. UI · 화면 맞춤 · 단축키 · 폰트 프리로드
   ════════════════════════════════════════════════════════════════════ */
const frame=document.getElementById('frame');
function fit(){const s=Math.min(innerWidth/W,innerHeight/H);frame.style.transform=`scale(${s})`;}
addEventListener('resize',fit);fit();
const rng=document.getElementById('rngRate');
rng.addEventListener('input',()=>document.getElementById('rateVal').textContent=parseFloat(rng.value).toFixed(2));
document.getElementById('btnStart').addEventListener('click',play);
document.getElementById('btnReplay').addEventListener('click',play);
document.getElementById('btnHome').addEventListener('click',toMenu);
document.getElementById('hudRestart').addEventListener('click',()=>{if(phase==='idle')return;play();});
document.getElementById('hudRec').addEventListener('click',()=>document.body.classList.toggle('rec'));
addEventListener('keydown',e=>{
  if(e.target.tagName==='SELECT'||e.target.tagName==='INPUT')return;
  if(e.key==='h'||e.key==='H')document.body.classList.toggle('rec');
  if((e.key==='r'||e.key==='R')&&phase!=='idle')play();
  if(e.code==='Space'){e.preventDefault();if(phase!=='play')play();}
});
if(!synth){document.getElementById('chkTTS').checked=false;document.getElementById('voiceHint').textContent='이 브라우저는 음성 합성을 지원하지 않아 자막 + 효과음으로 재생됩니다.';}

// 디버그: ?seek=초 → 해당 시점 정지 화면 (장면 수정·썸네일 캡처용)
const qs=new URLSearchParams(location.search);
if(qs.has('seek')){
  plan(parseFloat(qs.get('rate'))||opt.rate);
  document.getElementById('startUI').classList.add('hidden');
  phase='seek';T=parseFloat(qs.get('seek'))||0;
  let ci=0;CUES.forEach((c,i)=>{if(c.t<=T)ci=i;});
  showSub(CUES[ci]);st.done=true;updateSub(0);
}
window.__plan=()=>plan(opt.rate).scenes&&CUES.map(c=>({id:c.id,t:+c.t.toFixed(1),dur:+c.dur.toFixed(1),text:strip(c.text)}));

const glyphs=[...new Set(document.currentScript.textContent.replace(/[\x00-\x7F]/g,''))].join('');
const fontLoads=[['400 100px "Black Han Sans"'],['900 60px "Noto Sans KR"'],['700 40px "Noto Sans KR"'],['500 30px "Noto Sans KR"']]
  .map(([f])=>document.fonts?document.fonts.load(f,glyphs).catch(()=>{}):Promise.resolve());
Promise.race([Promise.all(fontLoads),new Promise(r=>setTimeout(r,3500))]).then(()=>{
  const b=document.getElementById('btnStart');b.disabled=false;b.textContent='▶ 재생 시작';
});
requestAnimationFrame(ms=>{last=ms;loop(ms);});
})();
</script>
